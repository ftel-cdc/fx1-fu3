# STM32F103CB/Blue Pill qua ST-Link, giao tiep SWD.
# Noi 3V3, GND, SWDIO (PA13) va SWCLK (PA14) giua probe va board.

source [find interface/stlink.cfg]
transport select hla_swd

# Board dang dung tra ve SW-DP ID 0x2ba01477 (Cortex-M3 r2p1), thay vi
# 0x1ba01477 mac dinh cua target/stm32f1x.cfg. Gia tri da doc truc tiep qua
# ST-Link; device ID van la 0x410 va OpenOCD probe dung Flash 128 KiB.
set CPUTAPID 0x2ba01477
source [find target/stm32f1x.cfg]

# Toc do bring-up an toan; co the tang sau khi ket noi on dinh.
adapter speed 1000
