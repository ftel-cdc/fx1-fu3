# STM32F103CB/Blue Pill via ST-Link, SWD communication. place 3V3, GND, SWDIO (PA13) and SWCLK (PA14)
# between probe and board.

source [find interface/stlink.cfg]
transport select hla_swd

# Board is using SW-DP ID 0x2ba01477 (Cortex-M3 r2p1), see because the default 0x1ba01477 of
# target/stm32f1x.cfg. value was read directly via ST-Link; device ID remains 0x410 and OpenOCD
# probe uses 128 KiB Flash.
set CPUTAPID 0x2ba01477
source [find target/stm32f1x.cfg]

# Toc that bring-up safely; can floor after finishing specified.
adapter speed 1000
