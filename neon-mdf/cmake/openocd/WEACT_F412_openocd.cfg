# WEACT_F412_openocd.cfg - board WeAct STM32F4 Core Board without on-board debugger (other than
# Nucleo) - must use SWD probe then (ST-LINK V2 clone or similar) use 4-pin header
# (3V3/GND/SWCLK/SWDIO) on the board. used
# scripts supplied with OpenOCD (interface/stlink.cfg, target/stm32f4x.cfg).
#
# real VERIFY on hardware multiple times (flash_jtag/flash_uart_stm32, see cmake/flash_targets.cmake)
# - operations on specified.
#
# unique source - each app (Blinky, FreeRTOS_Blinky, newly created app via the "Create App" wizard)
# refers directly to this file through ${NEON_MDF_PATH}/cmake/openocd/WEACT_F412_openocd.cfg, there
# are no separate copies in each app anymore (previously there were 3 duplicate copies, deflecting
# comment/user over time - combined 2026-08-10).

source [find interface/stlink.cfg]
transport select hla_swd

source [find target/stm32f4x.cfg]

adapter speed 4000
