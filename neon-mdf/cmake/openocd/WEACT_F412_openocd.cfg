# WEACT_F412_openocd.cfg - board WeAct STM32F4 Core Board KHONG CO debugger
# on-board (khac Nucleo) - PHAI dung probe SWD roi (ST-LINK V2 clone hoac
# tuong duong) noi vao header 4 chan (3V3/GND/SWCLK/SWDIO) tren board. Dung
# script that di kem OpenOCD (interface/stlink.cfg, target/stm32f4x.cfg).
#
# DA VERIFY THAT tren phan cung nhieu lan (flash_jtag/flash_uart_stm32,
# xem cmake/flash_targets.cmake) - hoat dong on dinh.
#
# NGUON DUY NHAT - moi app (Blinky, FreeRTOS_Blinky, app moi tao qua wizard
# "Create App") deu tham chieu THANG toi file nay qua ${NEON_MDF_PATH}/cmake/openocd/WEACT_F412_openocd.cfg,
# KHONG con ban sao rieng trong tung app nua (truoc day co 3 ban sao trung
# lap, gay lech comment/noi dung theo thoi gian - da gop lai 2026-08-10).

source [find interface/stlink.cfg]
transport select hla_swd

source [find target/stm32f4x.cfg]

adapter speed 4000
