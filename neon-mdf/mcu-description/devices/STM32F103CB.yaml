# STM32F103CB.yaml — STM32F103xB medium-density, package 48 pin.
#
# Nguon doi chieu chinh thuc:
#   - DS5319 Rev 20: Features; Table 1 (Device summary); Section 2.3.2
#     (embedded Flash); Section 2.3.4 (embedded SRAM); Section 2.3.5 (NVIC);
#     Figure 11 (memory map); Section 7 (ordering information scheme).
#   - PM0056 Rev 7: Section 4.4.4 (SCB_VTOR).
#   - ST cmsis-device-f1, Include/stm32f103xb.h: khoi
#     Configuration_section_for_CMSIS va cac macro FLASH_BASE/SRAM_BASE.

device: STM32F103CB
vendor: STMicroelectronics
family: STM32F103
arch: cortex-m3
description: >
  STM32F103CB medium-density MCU, Cortex-M3, 128 KB Flash and 20 KB SRAM.

cpu:
  core: cortex-m3
  revision: r2p0              # stm32f103xb.h: __CM3_REV=0x0200U (Core Revision r2p0)
  max_freq_hz: 72000000       # DS5319 Features: Cortex-M3, 72 MHz maximum frequency
  nvic_priority_bits: 4       # stm32f103xb.h: __NVIC_PRIO_BITS=4U; DS5319 2.3.5: 16 levels
  num_irq: 43                 # DS5319 2.3.5: toi da 43 maskable interrupt channels
  vtor_supported: true        # PM0056 4.4.4: co SCB_VTOR; cho phep relocate vector table
  mpu_present: false          # stm32f103xb.h: __MPU_PRESENT=0U
  fpu_present: false          # Cortex-M3 cua STM32F103xB khong co FPU; ST header khong khai __FPU_PRESENT

memory:
  - name: FLASH_MEM           # Tranh trung FLASH_BASE voi peripheral FLASH o buoc sau
    kind: flash
    address: 0x08000000       # DS5319 Figure 11; stm32f103xb.h: FLASH_BASE
    size: 0x20000             # DS5319 Section 7: ma B = 128 KB
  - name: RAM
    kind: ram
    address: 0x20000000       # DS5319 Figure 11; stm32f103xb.h: SRAM_BASE
    size: 0x5000              # DS5319 Section 2.3.4: 20 KB SRAM

peripherals:
  # RM0008 Rev 21, Section 7.3.11, Table 18: RCC register map and reset values.
  # Base address doi chieu them voi ST cmsis-device-f1/stm32f103xb.h.
  - name: RCC
    base: 0x40021000
    description: "Reset and Clock Control"
    registers:
      - {name: CR,       offset: 0x00, size: 32, access: rw, reset: 0x00000083, description: "Clock control register"}
      - {name: CFGR,     offset: 0x04, size: 32, access: rw, reset: 0x00000000, description: "Clock configuration register"}
      - {name: CIR,      offset: 0x08, size: 32, access: rw, reset: 0x00000000, description: "Clock interrupt register"}
      - {name: APB2RSTR, offset: 0x0C, size: 32, access: rw, reset: 0x00000000, description: "APB2 peripheral reset register"}
      - {name: APB1RSTR, offset: 0x10, size: 32, access: rw, reset: 0x00000000, description: "APB1 peripheral reset register"}
      - {name: AHBENR,   offset: 0x14, size: 32, access: rw, reset: 0x00000014, description: "AHB peripheral clock enable register"}
      - {name: APB2ENR,  offset: 0x18, size: 32, access: rw, reset: 0x00000000, description: "APB2 peripheral clock enable register"}
      - {name: APB1ENR,  offset: 0x1C, size: 32, access: rw, reset: 0x00000000, description: "APB1 peripheral clock enable register"}
      - {name: BDCR,     offset: 0x20, size: 32, access: rw, reset: 0x00000000, description: "Backup domain control register"}
      - {name: CSR,      offset: 0x24, size: 32, access: rw, reset: 0x0C000000, description: "Control/status register"}

  # RM0008 Rev 21, Section 9.2: GPIO registers. STM32F1 dung CRL/CRH,
  # khong dung MODER/AFR nhu STM32F4. YAML anchor dam bao moi port co cung
  # mot register layout va chi sinh mot GPIO_TypeDef.
  - name: GPIOA
    type: GPIO
    base: 0x40010800
    description: "GPIO port A"
    registers: &gpio_registers
      - {name: CRL,  offset: 0x00, size: 32, access: rw, reset: 0x44444444, description: "Port configuration low register, pins 0..7"}
      - {name: CRH,  offset: 0x04, size: 32, access: rw, reset: 0x44444444, description: "Port configuration high register, pins 8..15"}
      # RM0008 9.2.3 ghi reset IDR la 0x0000 XXXX: 16 bit thap phu thuoc
      # muc dien tren chan. Schema chi nhan so nguyen nen dung 0 de bieu dien,
      # KHONG coi day la reset value phan cung xac dinh.
      - {name: IDR,  offset: 0x08, size: 32, access: ro, reset: 0x00000000, description: "Port input data register; reset bits 15:0 are pin-dependent (RM0008: 0x0000 XXXX)"}
      - {name: ODR,  offset: 0x0C, size: 32, access: rw, reset: 0x00000000, description: "Port output data register"}
      - {name: BSRR, offset: 0x10, size: 32, access: wo, reset: 0x00000000, description: "Port bit set/reset register"}
      - {name: BRR,  offset: 0x14, size: 32, access: wo, reset: 0x00000000, description: "Port bit reset register"}
      - {name: LCKR, offset: 0x18, size: 32, access: rw, reset: 0x00000000, description: "Port configuration lock register"}

  - name: GPIOB
    type: GPIO
    base: 0x40010C00
    description: "GPIO port B"
    registers: *gpio_registers

  - name: GPIOC
    type: GPIO
    base: 0x40011000
    description: "GPIO port C; STM32F103CB package chi bond mot tap con cac pin"
    registers: *gpio_registers

  - name: GPIOD
    type: GPIO
    base: 0x40011400
    description: "GPIO port D; STM32F103CB package chi bond PD0/PD1 (OSC_IN/OSC_OUT)"
    registers: *gpio_registers

  # RM0008 Rev 21, Section 27.6: USART register map. USART1 nam tren APB2
  # tai 0x40013800; mapping mac dinh la PA9=TX, PA10=RX (Table 54).
  # type UART giu dung contract cua components/driver/uart/neon_uart.h;
  # instance van mang ten peripheral that la USART1.
  - name: USART1
    type: UART
    base: 0x40013800
    description: "USART1; default pins PA9 TX and PA10 RX"
    registers:
      - {name: SR,   offset: 0x00, size: 32, access: rw, reset: 0x000000C0, description: "Status register"}
      - {name: DR,   offset: 0x04, size: 32, access: rw, reset: 0x00000000, description: "Data register"}
      - {name: BRR,  offset: 0x08, size: 32, access: rw, reset: 0x00000000, description: "Baud rate register"}
      - {name: CR1,  offset: 0x0C, size: 32, access: rw, reset: 0x00000000, description: "Control register 1"}
      - {name: CR2,  offset: 0x10, size: 32, access: rw, reset: 0x00000000, description: "Control register 2"}
      - {name: CR3,  offset: 0x14, size: 32, access: rw, reset: 0x00000000, description: "Control register 3"}
      - {name: GTPR, offset: 0x18, size: 32, access: rw, reset: 0x00000000, description: "Guard time and prescaler register"}

  # RM0008 Rev 21, Section 3.5: Flash memory interface register map for
  # STM32F10xxx medium-density devices. The bootloader erases 1 KiB pages
  # and programs 16-bit half-words through this peripheral.
  - name: FLASH
    base: 0x40022000
    description: "Flash memory interface"
    registers:
      - {name: ACR,       offset: 0x00, size: 32, access: rw, reset: 0x00000030, description: "Flash access control register"}
      - {name: KEYR,      offset: 0x04, size: 32, access: wo, reset: 0x00000000, description: "Flash key register"}
      - {name: OPTKEYR,   offset: 0x08, size: 32, access: wo, reset: 0x00000000, description: "Flash option key register"}
      - {name: SR,        offset: 0x0C, size: 32, access: rw, reset: 0x00000000, description: "Flash status register"}
      - {name: CR,        offset: 0x10, size: 32, access: rw, reset: 0x00000080, description: "Flash control register"}
      - {name: AR,        offset: 0x14, size: 32, access: rw, reset: 0x00000000, description: "Flash address register"}
      - {name: RESERVED0, offset: 0x18, size: 32, access: ro, reset: 0x00000000, description: "Reserved"}
      - {name: OBR,       offset: 0x1C, size: 32, access: ro, reset: 0x00000000, description: "Option byte register"}
      - {name: WRPR,      offset: 0x20, size: 32, access: ro, reset: 0xFFFFFFFF, description: "Write protection register"}

# ST cmsis-device-f1, Include/stm32f103xb.h, khoi
# "STM32 specific Interrupt Numbers". Ten phai giu nguyen de output khop
# CMSIS: <NAME>_IRQn trong header va <NAME>_IRQHandler trong startup.
interrupts:
  - {number: 0,  name: WWDG,               description: "Window watchdog"}
  - {number: 1,  name: PVD,                description: "PVD through EXTI"}
  - {number: 2,  name: TAMPER,             description: "Tamper"}
  - {number: 3,  name: RTC,                description: "RTC global"}
  - {number: 4,  name: FLASH,              description: "Flash global"}
  - {number: 5,  name: RCC,                description: "RCC global"}
  - {number: 6,  name: EXTI0,              description: "EXTI line 0"}
  - {number: 7,  name: EXTI1,              description: "EXTI line 1"}
  - {number: 8,  name: EXTI2,              description: "EXTI line 2"}
  - {number: 9,  name: EXTI3,              description: "EXTI line 3"}
  - {number: 10, name: EXTI4,              description: "EXTI line 4"}
  - {number: 11, name: DMA1_Channel1,      description: "DMA1 channel 1"}
  - {number: 12, name: DMA1_Channel2,      description: "DMA1 channel 2"}
  - {number: 13, name: DMA1_Channel3,      description: "DMA1 channel 3"}
  - {number: 14, name: DMA1_Channel4,      description: "DMA1 channel 4"}
  - {number: 15, name: DMA1_Channel5,      description: "DMA1 channel 5"}
  - {number: 16, name: DMA1_Channel6,      description: "DMA1 channel 6"}
  - {number: 17, name: DMA1_Channel7,      description: "DMA1 channel 7"}
  - {number: 18, name: ADC1_2,             description: "ADC1 and ADC2"}
  - {number: 19, name: USB_HP_CAN1_TX,     description: "USB HP or CAN1 TX"}
  - {number: 20, name: USB_LP_CAN1_RX0,    description: "USB LP or CAN1 RX0"}
  - {number: 21, name: CAN1_RX1,           description: "CAN1 RX1"}
  - {number: 22, name: CAN1_SCE,           description: "CAN1 SCE"}
  - {number: 23, name: EXTI9_5,            description: "EXTI lines 5 through 9"}
  - {number: 24, name: TIM1_BRK,           description: "TIM1 break"}
  - {number: 25, name: TIM1_UP,            description: "TIM1 update"}
  - {number: 26, name: TIM1_TRG_COM,       description: "TIM1 trigger and commutation"}
  - {number: 27, name: TIM1_CC,            description: "TIM1 capture compare"}
  - {number: 28, name: TIM2,               description: "TIM2 global"}
  - {number: 29, name: TIM3,               description: "TIM3 global"}
  - {number: 30, name: TIM4,               description: "TIM4 global"}
  - {number: 31, name: I2C1_EV,            description: "I2C1 event"}
  - {number: 32, name: I2C1_ER,            description: "I2C1 error"}
  - {number: 33, name: I2C2_EV,            description: "I2C2 event"}
  - {number: 34, name: I2C2_ER,            description: "I2C2 error"}
  - {number: 35, name: SPI1,               description: "SPI1 global"}
  - {number: 36, name: SPI2,               description: "SPI2 global"}
  - {number: 37, name: USART1,             description: "USART1 global"}
  - {number: 38, name: USART2,             description: "USART2 global"}
  - {number: 39, name: USART3,             description: "USART3 global"}
  - {number: 40, name: EXTI15_10,          description: "EXTI lines 10 through 15"}
  - {number: 41, name: RTC_Alarm,          description: "RTC alarm through EXTI"}
  - {number: 42, name: USBWakeUp,          description: "USB wakeup through EXTI"}

# Blue Pill STM32F103CB OTA foundation. The second-stage bootloader occupies
# the first 8 KiB. A 0x100-byte gap aligns the Cortex-M3 vector table to the
# required 256-byte boundary.
bootloader:
  size: 0x2000
  image_header_size: 0x100
  uart:
    peripheral: USART1
    tx_pin: PA9
    rx_pin: PA10
    af: 0
    baud: 115200

# STM32F103xB medium-density flash has 128 uniform 1 KiB erase pages.
erase_sectors:
  - size: 0x400
    count: 128
