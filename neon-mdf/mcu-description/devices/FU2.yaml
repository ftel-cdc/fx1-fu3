          - {name: CC3_FLAG,   bit_offset: 3, bit_width: 1, description: "Capture/compare event flag 3"}
          - {name: CC4_FLAG,   bit_offset: 4, bit_width: 1, description: "Capture/compare event flag 4"}
          - {name: BREAK_FLAG, bit_offset: 5, bit_width: 1, description: "Break-event flag"}

