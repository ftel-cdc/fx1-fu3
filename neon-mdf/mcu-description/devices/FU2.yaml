  - name: SPI0
    base: 0x440C0000
    type: SPI
    description: |
      SPI0 - DTI SPI rev1.1, Register Description chapter 9.
      SPI0 : 0x440C0000 - 0x440CFFFF (64 KB)
    registers: &spi_regs
      - name: TX
        offset: 0x000
        size: 32
        access: rw
        reset: 0x00000000
        description: "Transmit Register bit[31:0] DATA"
        fields:
          - {name: DATA, bit_offset: 0, bit_width: 32, description: "Transmit data; the effective width is determined by CMDCONF.LEN in master mode"}
      - name: CTRL
        offset: 0x004
        size: 32
        access: rw
        reset: 0x00000001
        description: "SPI Control Register bit[1:0] SPI_MODE | bit[2] CPOL | bit[3] CPHA | bit[4] LSB | bit[5] INT_EN | bit[6] SS_MODE | bit[7] SS_FORCE | bit[8] SS_LONG | bit[9] DMA_ENABLE"
        fields:
          - {name: SPI_MODE,   bit_offset: 0, bit_width: 2, description: "00=legacy slave, 01=legacy master, 10=extended DDR master; 11 reserved"}
          - {name: CPOL,       bit_offset: 2, bit_width: 1, description: "SCLK idle level: 0=low, 1=high"}
          - {name: CPHA,       bit_offset: 3, bit_width: 1, description: "Clock phase: 0=sample on the first edge, 1=sample on the second edge"}
          - {name: LSB,        bit_offset: 4, bit_width: 1, description: "Bit order: 0=MSB first, 1=LSB first"}
          - {name: INT_EN,     bit_offset: 5, bit_width: 1, description: "Enable FIFO-status interrupt outputs"}
          - {name: SS_MODE,    bit_offset: 6, bit_width: 1, description: "Master-mode SS control: 0=normal, 1=manual"}
          - {name: SS_FORCE,   bit_offset: 7, bit_width: 1, description: "In manual mode: 0=keep SS active, 1=allow SS release when conditions are met"}
          - {name: SS_LONG,    bit_offset: 8, bit_width: 1, description: "Keep SS active until the TX FIFO is empty for long access sequences"}
          - {name: DMA_ENABLE, bit_offset: 9, bit_width: 1, description: "Globally enable the DMA interface (ctrl_dspi_modeable in rev1.1)"}
      - name: CONFCMD
        offset: 0x008
        size: 32
        access: rw
        reset: 0x00A0D800
        description: "Extended DDR command configuration; unused in legacy SPI mode"
        fields:
          - {name: DDR,       bit_offset: 0,  bit_width: 2, description: "00=SDR, 01=instruction SDR and remaining phases DDR, 11=DDR"}
          - {name: INST,      bit_offset: 2,  bit_width: 8, description: "Instruction byte"}
          - {name: INST_EN,   bit_offset: 10, bit_width: 1, description: "Enable instruction phase"}
          - {name: DIRECTION, bit_offset: 11, bit_width: 1, description: "0=write, 1=read"}
          - {name: ADDR_EN,   bit_offset: 12, bit_width: 1, description: "Enable address phase"}
          - {name: ADSIZE,    bit_offset: 13, bit_width: 2, description: "Address size minus one byte, 0..3"}
          - {name: ALT_EN,    bit_offset: 15, bit_width: 1, description: "Enable alternate-byte phase"}
          - {name: ABSIZE,    bit_offset: 16, bit_width: 2, description: "Alternate-byte size minus one byte, 0..3"}
          - {name: DCYC,      bit_offset: 18, bit_width: 5, description: "Extended-command dummy length, 0..31"}
          - {name: DATA_EN,   bit_offset: 23, bit_width: 1, description: "Enable data phase"}
      - name: DLR
        offset: 0x00C
        size: 32
        access: rw
        reset: 0x00000000
        description: "Extended-mode data length register"
        fields:
          - {name: DATA_LEN, bit_offset: 0, bit_width: 32, description: "Number of data bytes to send or receive"}
      - name: AR
        offset: 0x010
        size: 32
        access: rw
        reset: 0x00000000
        description: "Extended-mode command address register"
        fields:
          - {name: ADDR, bit_offset: 0, bit_width: 32, description: "Command address"}
      - name: ABR
        offset: 0x014
        size: 32
        access: rw
        reset: 0x00000000
        description: "Extended-mode alternate-byte register"
        fields:
          - {name: ALT_BYTE, bit_offset: 0, bit_width: 32, description: "Alternate-byte data"}
      - name: FIFO
        offset: 0x018
        size: 32
        access: rw
        reset: 0x00FF00FF
        description: "FIFO Control Register bit[7:0] TXFF_PROG_FLVL | bit[15:8] TXFF_PROG_ELVL | bit[23:16] RXFF_PROG_FLVL | bit[31:24] RXFF_PROG_ELVL"
        fields:
          - {name: TXFF_PROG_FLVL, bit_offset: 0,  bit_width: 8, description: "Programmable TX FIFO full threshold"}
          - {name: TXFF_PROG_ELVL, bit_offset: 8,  bit_width: 8, description: "Programmable TX FIFO empty threshold"}
          - {name: RXFF_PROG_FLVL, bit_offset: 16, bit_width: 8, description: "Programmable RX FIFO full threshold"}
          - {name: RXFF_PROG_ELVL, bit_offset: 24, bit_width: 8, description: "Programmable RX FIFO empty threshold"}
      - name: CLK
        offset: 0x01C
        size: 32
        access: rw
        reset: 0x00000000
        description: "Clock Register bit[15:0] DIV"
        fields:
          - {name: DIV, bit_offset: 0, bit_width: 16, description: "SCLK period = 2 x (DIV + 1) x core-clock period"}
      - name: CMDCONF
        offset: 0x020
        size: 32
        access: rw
        reset: 0x00000027
        description: "Command Configuration Register bit[4:0] LEN | bit[5] RD | bit[9:6] SLAVE_EN"
        fields:
          - {name: LEN,      bit_offset: 0, bit_width: 5, description: "Frame length minus 1; only 7/15/23/31 are supported, corresponding to 8/16/24/32 bits"}
          - {name: RD,       bit_offset: 5, bit_width: 1, description: "Master: 1=store MISO data in the RX FIFO, 0=discard received data"}
          - {name: SLAVE_EN, bit_offset: 6, bit_width: 4, description: "Select SS0..SS3 as one-hot in master mode"}
      - name: TREG0
        offset: 0x024
        size: 32
        access: rw
        reset: 0x00000000
        description: "Timing Register 0 bit[15:0] T_SS2CK | bit[31:16] T_CK2SS"
        fields:
          - {name: T_SS2CK, bit_offset: 0,  bit_width: 16, description: "Number of cycles from SS assertion to SCLK generation"}
          - {name: T_CK2SS, bit_offset: 16, bit_width: 16, description: "Number of cycles from stopping SCLK to SS deassertion"}
      - name: TREG1
        offset: 0x028
        size: 32
        access: rw
        reset: 0x00000000
        description: "Timing Register 1 bit[15:0] T_B2B | bit[31:16] T_SS_TIMEOUT"
        fields:
          - {name: T_B2B,       bit_offset: 0,  bit_width: 16, description: "Delay between data bytes in core-clock cycles, including bytes within a 16/24/32-bit word"}
          - {name: T_SS_TIMEOUT, bit_offset: 16, bit_width: 16, description: "SS-active hold timeout; 0=disable the timeout function"}
      - name: TREG2
        offset: 0x02C
        size: 32
        access: rw
        reset: 0x00000000
        description: "Extended-mode timing register 2"
        fields:
          - {name: T_CMD2CMD, bit_offset: 0, bit_width: 16, description: "Delay between extended DDR commands in core-clock cycles"}
      - name: RX
        offset: 0x030
        size: 32
        access: ro
        reset: 0x00000000
        description: "Receive Register bit[31:0] DATA"
        fields:
          - {name: DATA, bit_offset: 0, bit_width: 32, description: "Receive data; the effective width is determined by CMDCONF.LEN in master mode"}
      - name: CLKS
        offset: 0x034
        size: 32
        access: ro
        reset: 0x00000000
        description: "Clock Status Register bit[0] CLK_FAILURE | bit[8:1] ADDR_FAILURE | bit[9] CMD_FAILURE"
        fields:
          - {name: CLK_FAILURE,  bit_offset: 0, bit_width: 1, description: "Core-clock stoppage detected"}
          - {name: ADDR_FAILURE, bit_offset: 1, bit_width: 8, description: "Address of the first APB command affected by the clock failure"}
          - {name: CMD_FAILURE,  bit_offset: 9, bit_width: 1, description: "Failed command type: 0=write, 1=read"}
      - name: STT
        offset: 0x038
        size: 32
        access: ro
        reset: 0x00000000
        description: "Status Register bit[0] INT_TXFF_FULL | bit[1] INT_TXFF_EMPTY | bit[2] INT_RXFF_FULL | bit[3] INT_RXFF_EMPTY | bit[4] INT_TXFF_PROG_FULL | bit[5] INT_TXFF_PROG_EMPTY | bit[6] INT_RXFF_PROG_FULL | bit[7] INT_RXFF_PROG_EMPTY"
        fields:
          - {name: INT_TXFF_FULL,       bit_offset: 0, bit_width: 1, description: "TX FIFO full"}
          - {name: INT_TXFF_EMPTY,      bit_offset: 1, bit_width: 1, description: "TX FIFO empty"}
          - {name: INT_RXFF_FULL,       bit_offset: 2, bit_width: 1, description: "RX FIFO full"}
          - {name: INT_RXFF_EMPTY,      bit_offset: 3, bit_width: 1, description: "RX FIFO empty"}
          - {name: INT_TXFF_PROG_FULL,  bit_offset: 4, bit_width: 1, description: "TX FIFO reached the programmable-full threshold"}
          - {name: INT_TXFF_PROG_EMPTY, bit_offset: 5, bit_width: 1, description: "TX FIFO reached the programmable-empty threshold"}
          - {name: INT_RXFF_PROG_FULL,  bit_offset: 6, bit_width: 1, description: "RX FIFO reached the programmable-full threshold"}
          - {name: INT_RXFF_PROG_EMPTY, bit_offset: 7, bit_width: 1, description: "RX FIFO reached the programmable-empty threshold"}
      - name: STT_DMA
        offset: 0x03C
        size: 32
        access: ro
        reset: 0x00000000
        description: "DMA Status Register bit[0] TRAN_DONE_RX | bit[1] TRAN_DONE_TX | bit[2] DMA_BUSY_RX | bit[3] DMA_BUSY_TX"
        fields:
          - {name: TRAN_DONE_RX, bit_offset: 0, bit_width: 1, description: "DMA RX flag: 0=incomplete, 1=complete"}
          - {name: TRAN_DONE_TX, bit_offset: 1, bit_width: 1, description: "DMA TX flag: 0=incomplete, 1=complete"}
          - {name: DMA_BUSY_RX, bit_offset: 2, bit_width: 1, description: "Circular RX reconfiguration readiness: 1=allowed, 0=not yet allowed"}
          - {name: DMA_BUSY_TX, bit_offset: 3, bit_width: 1, description: "Circular TX reconfiguration readiness: 1=allowed, 0=not yet allowed"}
      - name: CTRL_RX
        offset: 0x040
        size: 32
        access: rw
        reset: 0x00000000
        description: "DMA RX Control Register bit[0] ENABLE | bit[2:1] MAX_BURST_LEN | bit[3] BURST_MODE | bit[19:4] TOTAL_BYTES | bit[20] CIRCULAR_MODE | bit[21] CLEAR"
        fields:
          - {name: ENABLE,        bit_offset: 0, bit_width: 1,  description: "Enable the DMA RX channel"}
          - {name: MAX_BURST_LEN, bit_offset: 1, bit_width: 2,  description: "Singles-per-burst code: 0/1/2/3 correspond to 2/4/8/16"}
          - {name: BURST_MODE,    bit_offset: 3, bit_width: 1,  description: "0=SINGLE only, 1=BURST"}
          - {name: TOTAL_BYTES,   bit_offset: 4, bit_width: 16, description: "Total DMA RX bytes; DTI requires a multiple of 4"}
          - {name: CIRCULAR_MODE, bit_offset: 20, bit_width: 1, description: "0=one-shot transfer, 1=continuous transfers"}
          - {name: CLEAR, bit_offset: 21, bit_width: 1, description: "Clear transfer-complete state and rearm one-shot configuration"}
      - name: CTRL_TX
        offset: 0x044
        size: 32
        access: rw
        reset: 0x00000000
        description: "DMA TX Control Register bit[0] ENABLE | bit[2:1] MAX_BURST_LEN | bit[3] BURST_MODE | bit[19:4] TOTAL_BYTES | bit[20] CIRCULAR_MODE | bit[21] CLEAR"
        fields:
          - {name: ENABLE,        bit_offset: 0, bit_width: 1,  description: "Enable the DMA TX channel"}
          - {name: MAX_BURST_LEN, bit_offset: 1, bit_width: 2,  description: "Singles-per-burst code: 0/1/2/3 correspond to 2/4/8/16"}
          - {name: BURST_MODE,    bit_offset: 3, bit_width: 1,  description: "0=SINGLE only, 1=BURST"}
          - {name: TOTAL_BYTES,   bit_offset: 4, bit_width: 16, description: "Total DMA TX bytes; DTI requires a multiple of 4"}
          - {name: CIRCULAR_MODE, bit_offset: 20, bit_width: 1, description: "0=one-shot transfer, 1=continuous transfers"}
          - {name: CLEAR, bit_offset: 21, bit_width: 1, description: "Clear transfer-complete state and rearm one-shot configuration"}

  - name: UART0
    base: 0x440D0000
    type: UART
    description: |
      UART0 - UNIVERSAL ASYNCHRONOUS RECEIVER TRANSMITTER
      UART0 : 0x440D0000 - 0x440DFFFF (64 KB)
    registers: &uart_regs
      - name: RBR_DLL_THR
        offset: 0x000
        size: 32
        access: rw
        reset: 0x00000000
        description: "Shared Register bit[7:0]: DLAB=1 DLL (RW); DLAB=0 read RBR (RO), write THR (WO)"
        aliases:
          - name: RBR
            access: ro
            reset: 0x00000000
            description: "Receiver Buffer Register when DLAB=0 and the CPU reads"
            fields:
              - {name: RDATA, bit_offset: 0, bit_width: 9, description: "9-bit receive data in bits [8:0]"}
          - name: DLL
            access: rw
            reset: 0x00000000
            description: "Divisor Latch LSB when DLAB=1"
            fields:
              - {name: DLSB, bit_offset: 0, bit_width: 8, description: "Low 8 bits of the baud-rate divisor in bits [7:0]"}
          - name: THR
            access: wo
            reset: 0x00000000
            description: "Transmitter Holding Register when DLAB=0 and CPU write"
            fields:
              - {name: TDATA, bit_offset: 0, bit_width: 9, description: "9-bit transmit data in bits [8:0]"}
      - name: IER_DLM
        offset: 0x004
        size: 32
        access: rw
        reset: 0x00000000
        description: "Shared Register: DLAB=1 bit[7:0] DLM; DLAB=0 IER interrupt enables"
        aliases:
          - name: IER
            access: rw
            reset: 0x00000000
            description: "Interrupt Enable Register when DLAB=0"
            fields:
              - {name: ERBI,  bit_offset: 0, bit_width: 1, description: "Enable received-data-available interrupt"}
              - {name: ETBEI, bit_offset: 1, bit_width: 1, description: "Enable transmitter-holding-register full interrupt"}
              - {name: ELSI,  bit_offset: 2, bit_width: 1, description: "Enable receiver-line-status interrupt"}
              - {name: EDSSI, bit_offset: 3, bit_width: 1, description: "Enable modem-status interrupt"}
              - {name: AUCLR, bit_offset: 4, bit_width: 1, description: "Interrupt clearing: 0=hardware auto-clear, 1=software acknowledge by reading IIR"}
          - name: DLM
            access: rw
            reset: 0x00000000
            description: "Divisor Latch MSB when DLAB=1"
            fields:
              - {name: DLSM, bit_offset: 0, bit_width: 8, description: "High 8 bits of the baud-rate divisor in bits [7:0]"}
      - name: IIR_FCR
        offset: 0x008
        size: 32
        access: rw
        reset: 0x00000000
        description: "Shared Register: read IIR interrupt identification (RO); write FCR FIFO control (WO)"
        aliases:
          - name: IIR
            access: ro
            reset: 0x00000000
            description: "Interrupt Identification Register"
            fields:
              - {name: IPEND,  bit_offset: 0, bit_width: 1, description: "Interrupt-pending status: 1=pending, 0=none"}
              - {name: INTID,  bit_offset: 1, bit_width: 3, description: "Interrupt ID: 0=none, 1=TX full, 2=RX ready, 3=line status, 4=character timeout, 5=DMA TX done, 6=DMA RX done"}
          - name: FCR
            access: wo
            reset: 0x00000000
            description: "FIFO Control Register"
            fields:
              - {name: FIFOEN,   bit_offset: 0, bit_width: 1, description: "FIFO mode disable: 0=FIFOs enabled, 1=non-FIFO mode and counters cleared; clear before programming other FCR bits"}
              - {name: RXCLR,    bit_offset: 1, bit_width: 1, description: "Write 1 to clear the RX FIFO; self-clearing bit"}
              - {name: TXCLR,    bit_offset: 2, bit_width: 1, description: "Write 1 to clear the TX FIFO; self-clearing bit"}
      - name: LCR
        offset: 0x00C
        size: 32
        access: rw
        reset: 0x00000000
        description: "Line Control Register bit[1:0] WLS | bit[2] STB | bit[3] PEN | bit[4] EPS | bit[5] SP | bit[6] BC | bit[7] DLAB"
        fields:
          - {name: WLS,  bit_offset: 0, bit_width: 2, description: "Select data length: 00=5, 01=6, 10=7, 11=8 bit"}
          - {name: STB,  bit_offset: 2, bit_width: 1, description: "Select the number of stop bits"}
          - {name: PEN,  bit_offset: 3, bit_width: 1, description: "Enable parity"}
          - {name: EPS,  bit_offset: 4, bit_width: 1, description: "Select even parity when PEN=1"}
          - {name: SP,   bit_offset: 5, bit_width: 1, description: "Enable stick parity"}
          - {name: BC,   bit_offset: 6, bit_width: 1, description: "Control break transmission"}
          - {name: DLAB, bit_offset: 7, bit_width: 1, description: "Enable DLL and DLM access at the shared addresses"}
      - name: MCR
        offset: 0x010
        size: 32
        access: rw
        reset: 0x00000000
        description: "Modem Control Register bit[0] DTR | bit[1] RTS | bit[2] OUT1 | bit[3] OUT2 | bit[4] LOOP | bit[5] AFE | bit[6] IRDA | bit[7] SYN | bit[8] LSB_MSB"
        fields:
          - {name: DTR,     bit_offset: 0, bit_width: 1, description: "Control Data Terminal Ready"}
          - {name: RTS,     bit_offset: 1, bit_width: 1, description: "RTS control: 0=force active level, 1=hardware automatic control"}
          - {name: OUT1,    bit_offset: 2, bit_width: 1, description: "Modem output OUT1"}
          - {name: OUT2,    bit_offset: 3, bit_width: 1, description: "Modem output OUT2"}
          - {name: LOOP,    bit_offset: 4, bit_width: 1, description: "Enable internal loopback mode"}
          - {name: AFE,     bit_offset: 5, bit_width: 1, description: "Enable automatic flow control"}
          - {name: IRDA,    bit_offset: 6, bit_width: 1, description: "Enable IrDA mode"}
          - {name: SYN,     bit_offset: 7, bit_width: 1, description: "Enable synchronous transfer mode"}
          - {name: LSB_MSB, bit_offset: 8, bit_width: 1, description: "Select LSB-first or MSB-first data order"}
      - name: LSR
        offset: 0x014
        size: 32
        access: ro
        reset: 0x00000000
        description: "Line Status Register bit[0] DR | bit[1] OE | bit[2] PE | bit[3] FE | bit[4] BI | bit[5] THRF | bit[6] TEMT | bit[7] RXFIFOERR"
        fields:
          - {name: DR,        bit_offset: 0, bit_width: 1, description: "Receive data available"}
          - {name: OE,        bit_offset: 1, bit_width: 1, description: "Receive-data overrun error"}
          - {name: PE,        bit_offset: 2, bit_width: 1, description: "Parity error"}
          - {name: FE,        bit_offset: 3, bit_width: 1, description: "Framing error"}
          - {name: BI,        bit_offset: 4, bit_width: 1, description: "Break detected"}
          - {name: THRF,      bit_offset: 5, bit_width: 1, description: "Transmit holding register/FIFO full; 0 means new data may be written"}
          - {name: TEMT,      bit_offset: 6, bit_width: 1, description: "Transmitter completely empty"}
          - {name: RXFIFOERR, bit_offset: 7, bit_width: 1, description: "RX FIFO contains erroneous data"}
      - name: MSR
        offset: 0x018
        size: 32
        access: ro
        reset: 0x00000000
        description: "Modem Status Register bit[0] DCTS | bit[1] DDSR | bit[2] TERI | bit[3] DDCD | bit[4] CTS | bit[5] DSR | bit[6] RI | bit[7] DCD"
        fields:
          - {name: DCTS, bit_offset: 0, bit_width: 1, description: "CTS state changed"}
          - {name: DDSR, bit_offset: 1, bit_width: 1, description: "DSR state changed"}
          - {name: TERI, bit_offset: 2, bit_width: 1, description: "RI falling edge detected"}
          - {name: DDCD, bit_offset: 3, bit_width: 1, description: "DCD state changed"}
          - {name: CTS,  bit_offset: 4, bit_width: 1, description: "Clear To Send status"}
          - {name: DSR,  bit_offset: 5, bit_width: 1, description: "Data Set Ready status"}
          - {name: RI,   bit_offset: 6, bit_width: 1, description: "Ring Indicator status"}
          - {name: DCD,  bit_offset: 7, bit_width: 1, description: "Data Carrier Detect status"}
      - name: SCR
        offset: 0x01C
        size: 32
        access: rw
        reset: 0x00000000
        description: "Scratch Pad Register bit[7:0] SCR"
        fields:
          - {name: SCR, bit_offset: 0, bit_width: 8, description: "8-bit scratch data; does not affect UART operation"}
      - name: MDR
        offset: 0x020
        size: 32
        access: rw
        reset: 0x00000000
        description: "Mode Definition Register bit[0] OSM | bit[1] RTSN"
        fields:
          - {name: OSM,  bit_offset: 0, bit_width: 1, description: "Select oversampling: 0=x16, 1=x8"}
          - {name: RTSN, bit_offset: 1, bit_width: 1, description: "Select the active level of RTS"}
      - name: TCR
        offset: 0x024
        size: 32
        access: rw
        reset: 0x00000000
        description: "Transceiver Control Register bit[0] RS485_EN | bit[1] RE_POL | bit[2] DE_POL | bit[4:3] XFER_MODE | bit[5] DE_EN | bit[6] RE_EN"
        fields:
          - {name: RS485_EN,  bit_offset: 0, bit_width: 1, description: "Enable RS485 mode"}
          - {name: RE_POL,    bit_offset: 1, bit_width: 1, description: "Select Receiver Enable polarity"}
          - {name: DE_POL,    bit_offset: 2, bit_width: 1, description: "Select Driver Enable polarity"}
          - {name: XFER_MODE, bit_offset: 3, bit_width: 2, description: "Select the RS485 transfer mode in bits [4:3]"}
          - {name: DE_EN,     bit_offset: 5, bit_width: 1, description: "Control the Driver Enable output"}
          - {name: RE_EN,     bit_offset: 6, bit_width: 1, description: "Control the Receiver Enable output"}
      - name: DET
        offset: 0x028
        size: 32
        access: rw
        reset: 0x00000000
        description: "Driver Output Enable Timing Register bit[7:0] DE_ASSERTION_TIME | bit[23:16] DE_DEASSERTION_TIME"
        fields:
          - {name: DE_ASSERTION_TIME,   bit_offset: 0,  bit_width: 8, description: "DE assertion time in bits [7:0]"}
          - {name: DE_DEASSERTION_TIME, bit_offset: 16, bit_width: 8, description: "DE deassertion time in bits [23:16]"}
      - name: TAT
        offset: 0x02C
        size: 32
        access: rw
        reset: 0x00000000
        description: "Turnaround Timing Register bit[15:0] DE_TO_RE | bit[31:16] RE_TO_DE"
        fields:
          - {name: DE_TO_RE, bit_offset: 0,  bit_width: 16, description: "DE-to-RE transition time in bits [15:0]"}
          - {name: RE_TO_DE, bit_offset: 16, bit_width: 16, description: "RE-to-DE transition time in bits [31:16]"}
      - name: DLF
        offset: 0x030
        size: 32
        access: rw
        reset: 0x00000000
        description: "Divisor Latch Fraction Register bit[3:0] DLF"
        fields:
          - {name: DLF, bit_offset: 0, bit_width: 4, description: "4-bit fractional part of the baud-rate divisor in bits [3:0]"}
      - name: RAR
        offset: 0x034
        size: 32
        access: rw
        reset: 0x00000000
        description: "Receive Address Register bit[7:0] ADDR"
        fields:
          - {name: ADDR, bit_offset: 0, bit_width: 8, description: "Receive address in bits [7:0]"}
      - name: TAR
        offset: 0x038
        size: 32
        access: rw
        reset: 0x00000000
        description: "Transmit Address Register bit[7:0] ADDR"
        fields:
          - {name: ADDR, bit_offset: 0, bit_width: 8, description: "Transmit address in bits [7:0]"}
      - name: LCR_EXT
        offset: 0x03C
        size: 32
        access: rw
        reset: 0x00000000
        description: "Line Extended Control Register bit[0] DLS_E | bit[1] ADDR_MATCH | bit[2] SEND_ADDR | bit[3] TRANSMIT_MODE"
        fields:
          - {name: DLS_E,         bit_offset: 0, bit_width: 1, description: "Extend the data length to 9 bits"}
          - {name: ADDR_MATCH,    bit_offset: 1, bit_width: 1, description: "Enable address matching in 9-bit mode"}
          - {name: SEND_ADDR,     bit_offset: 2, bit_width: 1, description: "Request transmission of the address byte"}
          - {name: TRANSMIT_MODE, bit_offset: 3, bit_width: 1, description: "9-bit TX mode: 0=8-bit THR with separate address control, 1=9-bit THR"}
      - name: CLKS
        offset: 0x040
        size: 32
        access: ro
        reset: 0x00000000
        description: "Clock Status Register bit[0] CLK_FAILURE | bit[12:1] ADDR_FAILURE | bit[13] CMD_FAILURE; read-to-clear"
        fields:
          - {name: CLK_FAILURE,  bit_offset: 0, bit_width: 1, description: "Clock-error flag"}
          - {name: ADDR_FAILURE, bit_offset: 1, bit_width: 12, description: "Address of the first APB command affected by the clock failure"}
          - {name: CMD_FAILURE,  bit_offset: 13, bit_width: 1, description: "Failed command type: 0=write, 1=read"}

