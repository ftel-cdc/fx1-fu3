          - {name: QCMD_EN,       bit_offset: 3, bit_width: 1, description: "Enable SMBus quick-command"}
          - {name: ALERT_EN,      bit_offset: 4, bit_width: 1, description: "Enable SMBus ALERT"}
          - {name: ALERT_DEC_CLR, bit_offset: 5, bit_width: 1, description: "Clear the ALERT-detect status"}
          - {name: PEC_ERR_CLR,   bit_offset: 6, bit_width: 1, description: "Clear the PEC-error status"}
      - name: ICLFT
        offset: 0x078
        size: 32
        access: ro
        reset: 0x00000000
        description: "RO I2C Clock Failure Detect Register bit[0] CLK_FAILURE | bit[16:1] ADDR_FAILURE | bit[17] CMD_FAILURE"
        fields:
          - {name: CLK_FAILURE,  bit_offset: 0,  bit_width: 1,  description: "Clock failure detected"}
          - {name: ADDR_FAILURE, bit_offset: 1,  bit_width: 16, description: "Register address for the failed transaction"}
          - {name: CMD_FAILURE,  bit_offset: 17, bit_width: 1,  description: "Command causing the failure: 0=write, 1=read"}
      - name: IITR
        offset: 0x07C
        size: 32
        access: ro
        reset: 0x00000000
        description: "RO I2C Interrupt Status Register"
        fields:
          - {name: TRANSFER_DONE,   bit_offset: 0,  bit_width: 1, description: "Interrupt transfer-done active"}
          - {name: ADDR_NACK,       bit_offset: 1,  bit_width: 1, description: "Interrupt address-NACK active"}
          - {name: DATA_NACK,       bit_offset: 2,  bit_width: 1, description: "Interrupt data-NACK active"}
          - {name: TXFF_FULL,       bit_offset: 3,  bit_width: 1, description: "Interrupt TX FIFO full active"}
          - {name: TXFF_EMPTY,      bit_offset: 4,  bit_width: 1, description: "Interrupt TX FIFO empty active"}
          - {name: TXFF_PROG_FULL,  bit_offset: 5,  bit_width: 1, description: "Interrupt TX FIFO programmable-full active"}
          - {name: TXFF_PROG_EMPTY, bit_offset: 6,  bit_width: 1, description: "Interrupt TX FIFO programmable-empty active"}
          - {name: RXFF_FULL,       bit_offset: 7,  bit_width: 1, description: "Interrupt RX FIFO full active"}
          - {name: RXFF_EMPTY,      bit_offset: 8,  bit_width: 1, description: "Interrupt RX FIFO empty active"}
          - {name: RXFF_PROG_FULL,  bit_offset: 9,  bit_width: 1, description: "Interrupt RX FIFO programmable-full active"}
          - {name: RXFF_PROG_EMPTY, bit_offset: 10, bit_width: 1, description: "Interrupt RX FIFO programmable-empty active"}
          - {name: SCL_STUCK_LOW,   bit_offset: 11, bit_width: 1, description: "Interrupt SCL stuck-low active"}
          - {name: SDA_STUCK_LOW,   bit_offset: 12, bit_width: 1, description: "Interrupt SDA stuck-low active"}
          - {name: PEC_ERR,         bit_offset: 13, bit_width: 1, description: "PEC-error interrupt active"}
          - {name: ADD_MATCH,       bit_offset: 14, bit_width: 1, description: "Interrupt address-match active"}
          - {name: ARB_LOST,        bit_offset: 15, bit_width: 1, description: "Interrupt arbitration-lost active"}
          - {name: ALERT_DEC,       bit_offset: 16, bit_width: 1, description: "Interrupt SMBus ALERT active"}
          - {name: STOP_DEC,        bit_offset: 17, bit_width: 1, description: "STOP-detection interrupt active"}

  - name: SPI1
    base: 0x50090000
    type: SPI
    description: |
      SPI1 - SERIAL PERIPHERAL INTERFACE
      SPI1 : 0x50090000 - 0x5009FFFF (64 KB)
    registers: *spi_regs

  - name: ADC
    base: 0x500A0000
    description: |
      ADC - FU2 v8 23-register ADC controller.
    registers:
      - {name: VERSION,     offset: 0x000, size: 32, access: ro, reset: 0x00010000, description: "Version: minor[15:0], major[31:16]"}
      - name: CTRL
        offset: 0x004
        size: 32
        access: rw
        reset: 0x00000000
        description: "ADC control"
        fields:
          - {name: ADC_EN, bit_offset: 0, bit_width: 1, description: "Enable ADC conversion"}
      - name: CFG
        offset: 0x008
        size: 32
        access: rw
        reset: 0x00000010
        description: "Channel and sample selection"
        fields:
          - {name: CHANNEL, bit_offset: 0, bit_width: 4, description: "Input channel"}
          - {name: SAMP_SEL, bit_offset: 4, bit_width: 1, description: "Sample source selection"}
      - name: STATUS
        offset: 0x00C
        size: 32
        access: ro
        reset: 0x00000000
        description: "Conversion status"
        fields:
          - {name: DONE, bit_offset: 0, bit_width: 1, description: "Conversion complete"}
          - {name: READY, bit_offset: 1, bit_width: 1, description: "Result ready"}
          - {name: BUSY, bit_offset: 2, bit_width: 1, description: "Conversion busy"}
      - {name: DATA,       offset: 0x010, size: 32, access: ro, reset: 0x00000000, description: "12-bit averaged conversion data"}
      - name: TIMING
        offset: 0x014
        size: 32
        access: rw
        reset: 0x20040C00
        description: "ADC timing configuration"
        fields:
          - {name: SAMPCLK_LOW, bit_offset: 8, bit_width: 8, description: "Sample clock low time"}
          - {name: SAMPCLK_HIGH, bit_offset: 16, bit_width: 8, description: "Sample clock high time"}
          - {name: SETUP_WAIT, bit_offset: 24, bit_width: 8, description: "Setup wait time"}
      - name: SAMPLE_CFG
        offset: 0x018
        size: 32
        access: rw
        reset: 0x00000001
        description: "Sample averaging count"
        fields:
          - {name: SAMPLE_COUNT, bit_offset: 0, bit_width: 5, description: "Number of samples"}
      - {name: SAMPLE0, offset: 0x01C, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 0"}
      - {name: SAMPLE1, offset: 0x020, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 1"}
      - {name: SAMPLE2, offset: 0x024, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 2"}
      - {name: SAMPLE3, offset: 0x028, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 3"}
      - {name: SAMPLE4, offset: 0x02C, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 4"}
      - {name: SAMPLE5, offset: 0x030, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 5"}
      - {name: SAMPLE6, offset: 0x034, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 6"}
      - {name: SAMPLE7, offset: 0x038, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 7"}
      - {name: SAMPLE8, offset: 0x03C, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 8"}
      - {name: SAMPLE9, offset: 0x040, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 9"}
      - {name: SAMPLE10, offset: 0x044, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 10"}
      - {name: SAMPLE11, offset: 0x048, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 11"}
      - {name: SAMPLE12, offset: 0x04C, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 12"}
      - {name: SAMPLE13, offset: 0x050, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 13"}
      - {name: SAMPLE14, offset: 0x054, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 14"}
      - {name: SAMPLE15, offset: 0x058, size: 32, access: ro, reset: 0x00000000, description: "12-bit sample slot 15"}

  - name: TIM4
    base: 0x500B0000
    type: TIM
    description: |
      TIM4 - TIMER
      TIM4 : 0x500B0000 - 0x500BFFFF (64 KB)
      Reference: dti_timer_ug_rev1p0.pdf
    registers: *tim_regs

  - name: TIM5
    base: 0x500C0000
    type: TIM
    description: |
      TIM5 - TIMER
      TIM5 : 0x500C0000 - 0x500CFFFF (64 KB)
      Reference: dti_timer_ug_rev1p0.pdf
    registers: *tim_regs

  - name: TIM6
    base: 0x500D0000
    type: TIM
    description: |
      TIM6 - TIMER
      TIM6 : 0x500D0000 - 0x500DFFFF (64 KB)
      Reference: dti_timer_ug_rev1p0.pdf
    registers: *tim_regs

  - name: TIM7
    base: 0x500E0000
    type: TIM
    description: |
      TIM7 - TIMER
      TIM7 : 0x500E0000 - 0x500EFFFF (64 KB)
      Reference: dti_timer_ug_rev1p0.pdf
    registers: *tim_regs

  - name: RTC
    base: 0x500F0000
    description: |
      RTC - REAL TIME CLOCK
      RTC : 0x500F0000 - 0x500FFFFF (64 KB)
      Reference: dti_rtc_ug_rev1p0.pdf
    registers:
      - {name: RTIME,             offset: 0x000, size: 32, access: ro, reset: 0x00000000, description: "Current time register (BCD) bit[7:0] MILLISECOND | bit[14:8] SECOND | bit[21:15] MINUTE | bit[27:22] HOUR"}
      - {name: RDATE,             offset: 0x004, size: 32, access: ro, reset: 0x00000000, description: "Current date register (BCD) bit[5:0] DATE | bit[9:6] DAY | bit[14:10] MONTH | bit[30:15] YEAR"}
      - {name: TIMECFG,           offset: 0x008, size: 32, access: rw, reset: 0x00000000, description: "Time configuration register bit[6:0] SECOND | bit[13:7] MINUTE | bit[19:14] HOUR"}
      - {name: DATECFG,           offset: 0x00C, size: 32, access: rw, reset: 0x00000000, description: "Date configuration register bit[5:0] DATE | bit[10:6] MONTH | bit[26:11] YEAR"}
      - {name: CPSR,              offset: 0x010, size: 32, access: rw, reset: 0x00002710, description: "Counter prescaler register bit[25:0] DIV | bit[29:26] DLF_VALUE | bit[30] DLF_EN | bit[31] RTC_EN"}
      - {name: ALAR0,             offset: 0x014, size: 32, access: rw, reset: 0x00000000, description: "Alarm 0 duration register bit[15:0] ALARM_TIME"}
      - {name: ALAR1_INS0,        offset: 0x018, size: 32, access: rw, reset: 0x00000000, description: "Alarm 1 channel 0 register bit[6:0] ALARM_SECOND | bit[13:7] ALARM_MINUTE | bit[19:14] ALARM_HOUR | bit[20] ALARM_EN | bit[21] ALARM_ON; ALARM_ON bit[21] is RO"}
      - {name: ALAR1_INS1,        offset: 0x01C, size: 32, access: rw, reset: 0x00000000, description: "Alarm 1 channel 1 register bit[6:0] ALARM_SECOND | bit[13:7] ALARM_MINUTE | bit[19:14] ALARM_HOUR | bit[20] ALARM_EN | bit[21] ALARM_ON; ALARM_ON bit[21] is RO"}
      - {name: INTR_INS0,         offset: 0x020, size: 32, access: rw, reset: 0x00000000, description: "Event interrupt channel 0 register bit[7:0] INT_SECOND | bit[15:8] INT_MINUTE | bit[23:16] INT_HOUR | bit[24] INT_EN"}
      - {name: INTR_INS1,         offset: 0x024, size: 32, access: rw, reset: 0x00000000, description: "Event interrupt channel 1 register bit[7:0] INT_SECOND | bit[15:8] INT_MINUTE | bit[23:16] INT_HOUR | bit[24] INT_EN"}
      - {name: CSTW,              offset: 0x028, size: 32, access: rw, reset: 0x00000002, description: "Control stopwatch register bit[0] ENABLE | bit[1] AUTO_SAVE"}
      - {name: RSTW,              offset: 0x02C, size: 32, access: rw, reset: 0x00000000, description: "Reset stopwatch register bit[0] RESET"}
      - {name: CTSTW,             offset: 0x030, size: 32, access: rw, reset: 0x00000000, description: "Capture stopwatch register bit[0] CAPTURE"}
      - {name: TSTW,              offset: 0x034, size: 32, access: ro, reset: 0x00000000, description: "Captured stopwatch time register (BCD) bit[7:0] MILLISECOND | bit[14:8] SECOND | bit[21:15] MINUTE | bit[29:22] HOUR"}
      - {name: STT,               offset: 0x038, size: 32, access: ro, reset: 0x00000000, description: "Status register bit[0] INT_TXFF_FULL | bit[1] INT_TXFF_EMPTY"}
      - {name: CLKS,              offset: 0x03C, size: 32, access: ro, reset: 0x00000000, description: "Clock status register (Read-to-Clear) bit[0] CLK_FAILURE | bit[8:1] ADDR_FAILURE | bit[9] CMD_FAILURE; read-to-clear"}

