  - name: FLASH_CTRL
    base: 0x50000000
    type: FLASH
    description: |
      FLASH_CTRL - FLASH CONTROLLER
      FLASH_CTRL : 0x50000000 - 0x5000FFFF (64 KB)
      Reference: FU2 Common Specification v8 / FLASH controller v1.4
    registers:
      - name: VERSION
        offset: 0x000
        size: 32
        access: ro
        reset: 0x00010000
        description: "Version Register bit[15:0] MINOR_VERSION | bit[31:16] MAJOR_VERSION"
        fields:
          - {name: MINOR, bit_offset: 0,  bit_width: 16, description: "Minor version"}
          - {name: MAJOR, bit_offset: 16, bit_width: 16, description: "Major version"}
      # Timing register names, offsets and reset values are taken from the v8
      # VP-generated flashc_regs.inc. Firmware normally leaves them at reset.
      - {name: SET0_RD_TIMING,           offset: 0x010, size: 32, access: rw, reset: 0x00002224, description: "Set-0 read timing"}
      - {name: SET0_CFG_TIMING,          offset: 0x014, size: 32, access: rw, reset: 0x00000222, description: "Set-0 configuration timing"}
      - {name: SET0_PROG_TIMING0,        offset: 0x018, size: 32, access: rw, reset: 0x0078008A, description: "Set-0 program timing 0"}
      - {name: SET0_PROG_TIMING1,        offset: 0x01C, size: 32, access: rw, reset: 0x0222008F, description: "Set-0 program timing 1"}
      - {name: SET0_PROG_TIMING2,        offset: 0x020, size: 32, access: rw, reset: 0x0000F803, description: "Set-0 program timing 2"}
      - {name: SET0_ERASE_TIMING0,       offset: 0x024, size: 32, access: rw, reset: 0x00000003, description: "Set-0 erase timing 0"}
      - {name: SET0_SECTOR_ERASE_TIMING, offset: 0x028, size: 32, access: rw, reset: 0x26B182B8, description: "Set-0 sector erase timing"}
      - {name: SET0_CHIP_RCV,            offset: 0x02C, size: 32, access: rw, reset: 0x00001356, description: "Set-0 chip erase recovery"}
      - {name: SET0_CHIP_ERASE,          offset: 0x030, size: 32, access: rw, reset: 0x000BBFD0, description: "Set-0 chip erase timing"}
      # Offsets 0x34..0x5C are the remaining set-0/set-1 timing registers.
      # Keep their hardware names so generated headers match the v8 VP CSR.
      - {name: SET0_DPSTB_TIMING,       offset: 0x034, size: 32, access: rw, reset: 0x00000050, description: "Set-0 deep-power standby timing"}
      - {name: SET1_RD_TIMING,          offset: 0x038, size: 32, access: rw, reset: 0x00003334, description: "Set-1 read timing"}
      - {name: SET1_CFG_TIMING,         offset: 0x03C, size: 32, access: rw, reset: 0x00000444, description: "Set-1 configuration timing"}
      - {name: SET1_PROG_TIMING0,       offset: 0x040, size: 32, access: rw, reset: 0x01E001F4, description: "Set-1 program timing 0"}
      - {name: SET1_PROG_TIMING1,       offset: 0x044, size: 32, access: rw, reset: 0x02220208, description: "Set-1 program timing 1"}
      - {name: SET1_PROG_TIMING2,       offset: 0x048, size: 32, access: rw, reset: 0x00038409, description: "Set-1 program timing 2"}
      - {name: SET1_ERASE_TIMING0,      offset: 0x04C, size: 32, access: rw, reset: 0x00000009, description: "Set-1 erase timing 0"}
      - {name: SET1_SECTOR_ERASE_TIMING, offset: 0x050, size: 32, access: rw, reset: 0x8CA57E40, description: "Set-1 sector erase timing"}
      - {name: SET1_CHIP_RCV,           offset: 0x054, size: 32, access: rw, reset: 0x00004650, description: "Set-1 chip erase recovery"}
      - {name: SET1_CHIP_ERASE,         offset: 0x058, size: 32, access: rw, reset: 0x002AB980, description: "Set-1 chip erase timing"}
      - {name: SET1_DPSTB_TIMING,       offset: 0x05C, size: 32, access: rw, reset: 0x00000122, description: "Set-1 deep-power standby timing"}
      - name: COMMAND
        offset: 0x060
        size: 32
        access: rw
        reset: 0x00000000
        description: "Command register bit[0] START | bit[3:1] CMD_OPCODE"
        fields:
          - {name: START,      bit_offset: 0, bit_width: 1, description: "Start command; hardware clears it on completion"}
          - {name: CMD_OPCODE, bit_offset: 1, bit_width: 3, description: "1=INIT, 2=SECTOR_ERASE, 3=CHIP_ERASE, 5=DPSTB_ENTRY, 6=DPSTB_EXIT"}
      - {name: CMD_ADDR, offset: 0x064, size: 32, access: rw, reset: 0x00000000, description: "Logical SoC address used by erase commands"}
      - name: SLOT_COMMAND
        offset: 0x068
        size: 32
        access: rw
        reset: 0x00000000
        description: "NVR slot command bit[0] START | bit[1] PROGRAMMED | bit[2] LOCK | bit[6:3] SLOT_INDEX"
        fields:
          - {name: START,      bit_offset: 0, bit_width: 1, description: "Start slot command"}
          - {name: PROGRAMMED, bit_offset: 1, bit_width: 1, description: "Programmed value"}
          - {name: LOCK,       bit_offset: 2, bit_width: 1, description: "Lock value"}
          - {name: SLOT_INDEX, bit_offset: 3, bit_width: 4, description: "NVR slot index 0 through 13"}
      - name: STATUS
        offset: 0x06C
        size: 32
        access: ro
        reset: 0x00000000
        description: "Command engine status"
        fields:
          - {name: BUSY,              bit_offset: 0, bit_width: 1, description: "Command engine busy"}
          - {name: SLOT_ISSUE_DONE,   bit_offset: 1, bit_width: 1, description: "NVR slot command complete"}
          - {name: INIT_DONE,         bit_offset: 2, bit_width: 1, description: "Initialization complete"}
          - {name: SECTOR_ERASE_DONE, bit_offset: 3, bit_width: 1, description: "Sector erase complete"}
          - {name: CHIP_ERASE_DONE,   bit_offset: 4, bit_width: 1, description: "Chip erase complete"}
          - {name: DPSTB_DONE,        bit_offset: 5, bit_width: 1, description: "Deep-power standby exit complete"}

