# ============================================================================
# @file     FU2.yaml
# @brief    FPT Telecom FU2 MCU description (Cortex-M0, up to 60MHz, 512KB Flash,
#           128KB RAM)
#           This file contains:
#           - Device information (vendor, family, architecture, description)
#           - CPU core details
#           - Memory map (BOOT_ROM, FLASH_NVR, FLASH, RAM, QSPI_XIP)
#           - Peripheral base addresses and register layouts
# @Note     Memory/peripheral addresses and interrupts follow the FU2 Common
#           Specification v8. Application images use the RTL BootROM v5 contract.
#
# @author   QuocBuu
# @date     Created: 2026-09-16
# @date     Updated: 2026-09-28
# ============================================================================

# ----------------------------------------------------------------------------
# Device Information
# ----------------------------------------------------------------------------
device: FU2
vendor: FPTTelecom
family: FU2
arch: cortex-m0
description: |
  FU2 - FPT Telecom FU2 MCU
  - Core : Cortex-M0 - up to 60MHz
  - Flash: 512KB instruction Flash + 14 x 512-byte NVR slots
  - RAM  : 128KB contiguous SRAM (data only)
  | IP         | Address range                   |
  | ---------- | ------------------------------- |
  | AES        | 0x40000000 - 0x4000FFFF (64 KB) |
  | QSPI_APB   | 0x44000000 - 0x4400FFFF (64 KB) |
  | SYSCSR     | 0x44010000 - 0x4401FFFF (64 KB) |
  | DMA0       | 0x44020000 - 0x4402FFFF (64 KB) |
  | RNG        | 0x44030000 - 0x4403FFFF (64 KB) |
  | CRC        | 0x44040000 - 0x4404FFFF (64 KB) |
  | WDT        | 0x44050000 - 0x4405FFFF (64 KB) |
  | TIM0       | 0x44060000 - 0x4406FFFF (64 KB) |
  | TIM1       | 0x44070000 - 0x4407FFFF (64 KB) |
  | TIM2       | 0x44080000 - 0x4408FFFF (64 KB) |
  | TIM3       | 0x44090000 - 0x4409FFFF (64 KB) |
  | PWM0       | 0x440A0000 - 0x440AFFFF (64 KB) |
  | PWM1       | 0x440B0000 - 0x440BFFFF (64 KB) |
  | SPI0       | 0x440C0000 - 0x440CFFFF (64 KB) |
  | UART0      | 0x440D0000 - 0x440DFFFF (64 KB) |
  | UART1      | 0x440E0000 - 0x440EFFFF (64 KB) |
  | GPIOC      | 0x440F0000 - 0x440FFFFF (64 KB) |
  | GPIOD      | 0x44100000 - 0x4410FFFF (64 KB) |
  | GPIOE      | 0x44110000 - 0x4411FFFF (64 KB) |
  | GPIOF      | 0x44120000 - 0x4412FFFF (64 KB) |
  | FLASH_CTRL | 0x50000000 - 0x5000FFFF (64 KB) |
  | CRM        | 0x50010000 - 0x5001FFFF (64 KB) |
  | DMA1       | 0x50020000 - 0x5002FFFF (64 KB) |
  | GPIOA      | 0x50030000 - 0x5003FFFF (64 KB) |
  | GPIOB      | 0x50040000 - 0x5004FFFF (64 KB) |
  | UART2      | 0x50050000 - 0x5005FFFF (64 KB) |
  | UART3      | 0x50060000 - 0x5006FFFF (64 KB) |
  | UART4      | 0x50070000 - 0x5007FFFF (64 KB) |
  | I2C0       | 0x50080000 - 0x5008FFFF (64 KB) |
  | SPI1       | 0x50090000 - 0x5009FFFF (64 KB) |
  | ADC        | 0x500A0000 - 0x500AFFFF (64 KB) |
  | TIM4       | 0x500B0000 - 0x500BFFFF (64 KB) |
  | TIM5       | 0x500C0000 - 0x500CFFFF (64 KB) |
  | TIM6       | 0x500D0000 - 0x500DFFFF (64 KB) |
  | TIM7       | 0x500E0000 - 0x500EFFFF (64 KB) |
  | RTC        | 0x500F0000 - 0x500FFFFF (64 KB) |

# ----------------------------------------------------------------------------
# CPU Core Details
# CORE                : Cortex-M0
# REVISION            : r0p0
# MAX_FREQ_HZ         : 60 MHz
# NVIC_PRIORITY_BITS  : 2
# NUM_IRQ             : 32
# VTOR_SUPPORTED      : false
# ----------------------------------------------------------------------------
cpu:
  core: cortex-m0
  revision: r0p0
  max_freq_hz: 60000000
  nvic_priority_bits: 2
  num_irq: 32
  vtor_supported: false

# ----------------------------------------------------------------------------
# Memory Region Layout (FU2 Common Specification v8)
# ROM                : 0x00000000 - 0x00001FFF (8 KB)
# Flash NVR          : 0x00010000 - 0x00011BFF (14 x 512 B = 7 KB)
# Instruction Flash  : 0x00020000 - 0x0009FFFF (512 KB)
# SRAM (data only)   : 0x01000000 - 0x0101FFFF (128 KB)
# QSPI XIP           : 0x30000000 - 0x3003FFFF (256 KB)
# ----------------------------------------------------------------------------
memory:
  - name: BOOT_ROM
    kind: rom
    address: 0x00000000
    size: 0x2000
  - name: FLASH
    kind: flash
    address: 0x00020000
    size: 0x80000
  - name: FLASH_NVR
    kind: flash
    address: 0x00010000
    size: 0x1C00
  - name: QSPI_XIP
    kind: flash
    address: 0x30000000
    size: 0x40000
  - name: RAM
    kind: ram
    address: 0x01000000
    size: 0x20000

# ----------------------------------------------------------------------------
# Image Profile Settings
#
# Profile            : normal (default)           | xip
# Flash region       : FLASH                      | QSPI_XIP
# RAM region         : RAM                        | RAM
#
# Flash layout:
#   Header: first 0x80 bytes of the selected Flash region.
#   Application      : 0x00020080 - 0x0009FFFF    | 0x30000080 - 0x3003FFFF
#
# RAM layout:
#   Boot ROM runtime : 0x01000000 - 0x01000FFF    | 0x01000000 - 0x01000FFF
#   Application RAM  : 0x01001000 - 0x0101FFFF    | 0x01001000 - 0x0101FFFF
#
# Selection:
#   --profile normal
#   --profile xip
#
# Layout usage:
#   reserved         : Region is occupied/reserved and must not be allocated.
#   allocatable      : Region is available for application code or data.
#
# Notes:
#   - All layout offsets are relative to the selected memory region.
#   - "remaining" means from the specified offset to the end of the parent region.
#   - Additional reserved or allocatable ranges may be added when required.
#   - Layout entries may represent firmware, metadata, shared memory, persistent
#     data, or any other reserved resource.
# ----------------------------------------------------------------------------
profile_param:

  # --------------------------------------------------------------------------
  # NORMAL
  #
  # Execute application directly from internal instruction FLASH.
  #
  # RTL BootROM v5 validates a 128-byte header before the application vectors.
  # Keep the Test_VP RAM layout: the first 4 KB remains unavailable to the app,
  # including the relay words at 0x01000000 and 0x01000004.
  # --------------------------------------------------------------------------
  - name: "normal"

    flash:
      region: FLASH
      description: |
        Internal instruction Flash used as the executable image region.

      layout:
        - name: image_header
          offset: 0x0000
          size: 0x0080
          usage: reserved
          description: |
            RTL BootROM v5 image header, supplied by tools/fu2_image.py.

        - name: application
          offset: 0x0080
          size: remaining
          usage: allocatable
          description: |
            Application payload. Its 48-word vector table follows the header
            at 0x00020080.

    ram:
      region: RAM
      description: |
        Contiguous SRAM used by the application runtime.

      layout:
        - name: irq_relay
          offset: 0x0000
          size: 0x0008
          usage: reserved
          description: |
            ROM-published application vector base and exclusive payload end.

        - name: bootrom_runtime
          offset: 0x0008
          size: 0x0FF8
          usage: reserved
          description: |
            Remaining reserved SRAM, preserving the Test_VP runtime layout.
            Application startup must not clear either this range or irq_relay.

        - name: application
          offset: 0x1000
          size: remaining
          usage: allocatable
          description: |
            Available SRAM area for application .data, .bss, heap, stack,
            and other runtime data.


  # --------------------------------------------------------------------------
  # XIP
  #
  # Execute application directly from the QSPI XIP address space.
  #
  # QSPI XIP uses the same 128-byte header as internal Flash.
  # The vector table starts at 0x30000080. SRAM partitioning is unchanged.
  # --------------------------------------------------------------------------
  - name: "xip"

    flash:
      region: QSPI_XIP
      description: |
        Memory-mapped external QSPI Flash used as the executable XIP region.

      layout:
        - name: image_header
          offset: 0x0000
          size: 0x0080
          usage: reserved
          description: |
            RTL BootROM v5 image header, supplied by tools/fu2_image.py.

        - name: application
          offset: 0x0080
          size: remaining
          usage: allocatable
          description: |
            Available QSPI XIP area for the application vector table,
            executable code, read-only data, and other XIP image sections.

    ram:
      region: RAM
      description: |
        Contiguous SRAM used by the application runtime.

      layout:
        - name: irq_relay
          offset: 0x0000
          size: 0x0008
          usage: reserved
          description: |
            ROM-published application vector base and exclusive payload end.

        - name: bootrom_runtime
          offset: 0x0008
          size: 0x0FF8
          usage: reserved
          description: |
            Boot ROM runtime and application-vector forwarding state.

        - name: application
          offset: 0x1000
          size: remaining
          usage: allocatable
          description: |
            Available SRAM area for application .data, .bss, heap, stack,
            and other runtime data.

# --------------------------------------------------------------------------
# Peripheral Register Layouts
# SYSBUS_BASE          0x40000000UL /*!< System Bus base address */
# PERIPH_0_BASE        0x44000000UL /*!< Peripheral 0 base address */
# PERIPH_1_BASE        0x50000000UL /*!< Peripheral 1 base address */
# PPB_BASE             0xE0000000UL /*!< Private Peripheral Bus base address */
# --------------------------------------------------------------------------
peripherals:
  - name: AES
    base: 0x40000000
    description: |
      AES-128 - ADVANCED ENCRYPTION STANDARD
      AES : 0x40000000 - 0x4000FFFF (64 KB)
      Reference: FU2_AES_Specification_v1.0.pdf
    registers:
      - {name: VERSION,           offset: 0x000, size: 32, access: ro, reset: 0x00000001, description: "AES IP version register"}
      - {name: CTRL,              offset: 0x004, size: 32, access: rw, reset: 0x00000000, description: "AES control register"}
      - {name: STATUS,            offset: 0x008, size: 32, access: ro, reset: 0x00000001, description: "AES status register"}
      - {name: KEY0,              offset: 0x040, size: 32, access: rw, reset: 0x00000000, description: "AES key bits [31:0]"}
      - {name: KEY1,              offset: 0x044, size: 32, access: rw, reset: 0x00000000, description: "AES key bits [63:32]"}
      - {name: KEY2,              offset: 0x048, size: 32, access: rw, reset: 0x00000000, description: "AES key bits [95:64]"}
      - {name: KEY3,              offset: 0x04C, size: 32, access: rw, reset: 0x00000000, description: "AES key bits [127:96]"}
      - {name: IV0,               offset: 0x080, size: 32, access: rw, reset: 0x00000000, description: "Initial vector bits [31:0]"}
      - {name: IV1,               offset: 0x084, size: 32, access: rw, reset: 0x00000000, description: "Initial vector bits [63:32]"}
      - {name: IV2,               offset: 0x088, size: 32, access: rw, reset: 0x00000000, description: "Initial vector bits [95:64]"}
      - {name: IV3,               offset: 0x08C, size: 32, access: rw, reset: 0x00000000, description: "Initial vector bits [127:96]"}
      - {name: DIN0,              offset: 0x0C0, size: 32, access: wo, reset: 0x00000000, description: "Input data bits [31:0]"}
      - {name: DIN1,              offset: 0x0C4, size: 32, access: wo, reset: 0x00000000, description: "Input data bits [63:32]"}
      - {name: DIN2,              offset: 0x0C8, size: 32, access: wo, reset: 0x00000000, description: "Input data bits [95:64]"}
      - {name: DIN3,              offset: 0x0CC, size: 32, access: wo, reset: 0x00000000, description: "Input data bits [127:96]"}
      - {name: DOUT0,             offset: 0x100, size: 32, access: ro, reset: 0x00000000, description: "Output data bits [31:0]"}
      - {name: DOUT1,             offset: 0x104, size: 32, access: ro, reset: 0x00000000, description: "Output data bits [63:32]"}
      - {name: DOUT2,             offset: 0x108, size: 32, access: ro, reset: 0x00000000, description: "Output data bits [95:64]"}
      - {name: DOUT3,             offset: 0x10C, size: 32, access: ro, reset: 0x00000000, description: "Output data bits [127:96]"}
      - {name: CTR0,              offset: 0x140, size: 32, access: rw, reset: 0x00000000, description: "Counter bits [31:0] / CFB segment length"}
      - {name: CTR1,              offset: 0x144, size: 32, access: rw, reset: 0x00000000, description: "Counter bits [63:32]"}
      - {name: CTR2,              offset: 0x148, size: 32, access: rw, reset: 0x00000000, description: "Counter bits [95:64]"}
      - {name: CTR3,              offset: 0x14C, size: 32, access: rw, reset: 0x00000000, description: "Counter bits [127:96]"}

  - name: QSPI_APB
    base: 0x44000000
    type: QSPI
    description: |
      QSPI - QUAD SERIAL PERIPHERAL INTERFACE CONTROLLER
      QSPI_APB : 0x44000000 - 0x4400FFFF (64 KB)
      Reference: dti_qspi_ug_rev0p0p1.pdf
    registers:
      - {name: TX,                offset: 0x000, size: 32, access: rw, reset: 0x00000000, description: "Transmit register"}
      - {name: CCR,               offset: 0x004, size: 32, access: rw, reset: 0x03A0EC00, description: "Command configuration register"}
      - {name: DLR,               offset: 0x008, size: 32, access: rw, reset: 0x00000000, description: "Data length register"}
      - {name: AR,                offset: 0x00C, size: 32, access: rw, reset: 0x00000000, description: "Address register"}
      - {name: ABR,               offset: 0x010, size: 32, access: rw, reset: 0x00000000, description: "Alternate-byte register"}
      - {name: SSR,               offset: 0x014, size: 32, access: rw, reset: 0x00000002, description: "Slave select register"}
      - {name: SMR,               offset: 0x018, size: 32, access: rw, reset: 0x00000000, description: "Polling status mask register"}
      - {name: SMPR,              offset: 0x01C, size: 32, access: rw, reset: 0x00000000, description: "Polling status match pattern register"}
      - {name: CFG,               offset: 0x020, size: 32, access: rw, reset: 0x00001C30, description: "QSPI configuration register"}
      - {name: CAR,               offset: 0x024, size: 32, access: rw, reset: 0x00000000, description: "QSPI abort control register"}
      - {name: STT,               offset: 0x028, size: 32, access: ro, reset: 0x00000000, description: "QSPI status register"}
      - {name: IMR,               offset: 0x02C, size: 32, access: rw, reset: 0x00000000, description: "Interrupt mask register"}
      - {name: RISR,              offset: 0x030, size: 32, access: ro, reset: 0x00000000, description: "Raw interrupt status register"}
      - {name: MISR,              offset: 0x034, size: 32, access: ro, reset: 0x00000000, description: "Masked interrupt status register"}
      - {name: ICR,               offset: 0x038, size: 32, access: wo, reset: 0x00000000, description: "Interrupt clear register (W1C)"}
      - {name: FIFO,              offset: 0x03C, size: 32, access: rw, reset: 0x301FC07F, description: "FIFO programmed level register"}
      - {name: SCLK,              offset: 0x040, size: 32, access: rw, reset: 0x00000000, description: "QSPI clock divider register"}
      - {name: TREG0,             offset: 0x044, size: 32, access: rw, reset: 0x00000000, description: "Timing register 0"}
      - {name: TREG1,             offset: 0x048, size: 32, access: rw, reset: 0x00000000, description: "Timing register 1"}
      - {name: TREG2,             offset: 0x04C, size: 32, access: rw, reset: 0x00200000, description: "Timing register 2"}
      - {name: TREG3,             offset: 0x050, size: 32, access: rw, reset: 0x00000001, description: "Timing register 3"}
      - {name: PHYCFG,            offset: 0x054, size: 32, access: rw, reset: 0x00002800, description: "PHY configuration register"}
      - {name: PHYFCLK,           offset: 0x058, size: 32, access: rw, reset: 0x00000000, description: "PHY feedback clock control register"}
      - {name: RX,                offset: 0x05C, size: 32, access: ro, reset: 0x00000000, description: "Receive register"}
      - {name: PHYSTT,            offset: 0x060, size: 32, access: ro, reset: 0x00000000, description: "PHY status register"}
      - {name: DMACTRL,           offset: 0x064, size: 32, access: rw, reset: 0x00000000, description: "DMA control register"}
      - {name: DMASTT,            offset: 0x068, size: 32, access: ro, reset: 0x00000000, description: "DMA status register"}

  - name: SYSCSR
    base: 0x44010000
    description: |
      SYSCSR - SYSTEM CONTROL AND STATUS REGISTERS
      SYSCSR : 0x44010000 - 0x4401FFFF (64 KB)
      Reference: FU2_SYSCSR_v4.xlsx
    registers:
      - name: VERSION
        offset: 0x000
        size: 32
        access: ro
        reset: 0x00000000
        description: "SYSCSR Version bit[15:0] MINOR | bit[31:16] MAJOR"
        fields:
          - {name: MINOR, bit_offset: 0, bit_width: 16, description: "Minor version number in bits [15:0]"}
          - {name: MAJOR, bit_offset: 16, bit_width: 16, description: "Major version number in bits [31:16]"}
      - name: LEFT_IO_CFG
        offset: 0x010
        size: 32
        access: rw
        reset: 0x00000000
        description: "IO Mux Register: 16 two-bit fields in bit[31:0]"
        fields:
          - {name: MODE, bit_offset: 0, bit_width: 32, description: "Sixteen 2-bit mux fields; field n is located at 2*n"}
      - name: BOT_IO_CFG
        offset: 0x014
        size: 32
        access: rw
        reset: 0x00000000
        description: "IO Mux Register: 16 two-bit fields in bit[31:0]"
        fields:
          - {name: MODE, bit_offset: 0, bit_width: 32, description: "Sixteen 2-bit mux fields; field n is located at 2*n"}
      - name: RIGHT_IO_CFG
        offset: 0x018
        size: 32
        access: rw
        reset: 0x00000000
        description: "IO Mux Register: 16 two-bit fields in bit[31:0]"
        fields:
          - {name: MODE, bit_offset: 0, bit_width: 32, description: "Sixteen 2-bit mux fields; field n is located at 2*n"}
      - name: TOP_IO_CFG
        offset: 0x01C
        size: 32
        access: rw
        reset: 0x00000000
        description: "IO Mux Register: 16 two-bit fields in bit[31:0]"
        fields:
          - {name: MODE, bit_offset: 0, bit_width: 32, description: "Sixteen 2-bit mux fields; field n is located at 2*n"}
      - name: LEFT_PAD_CTRL0
        offset: 0x020
        size: 32
        access: rw
        reset: 0x00F86C3F
        description: "Pad Control Register bit[11:0] IE | bit[23:12] PE (active-low pull enable)"
        fields:
          - {name: IE, bit_offset: 0, bit_width: 12, description: "Enable the digital input path, one bit per pad"}
          - {name: PE, bit_offset: 12, bit_width: 12, description: "Pull-cell control active-low: 0=enabled, 1=disabled"}
      - name: LEFT_PAD_CTRL1
        offset: 0x024
        size: 32
        access: rw
        reset: 0x00FFFFFF
        description: "Pad Control Register bit[11:0] DS"
        fields:
          - {name: DS, bit_offset: 0, bit_width: 12, description: "Coarse drive strength: 0=low, 1=high"}
      - name: LEFT_PAD_CTRL2
        offset: 0x028
        size: 32
        access: rw
        reset: 0x00000000
        description: "Pad Control Register bit[11:0] SL | bit[23:12] CS"
        fields:
          - {name: SL, bit_offset: 0, bit_width: 12, description: "Slew rate: 0=slow, 1=fast"}
          - {name: CS, bit_offset: 12, bit_width: 12, description: "Schmitt trigger: 0=disabled, 1=enabled"}
      - name: LEFT_PAD_CTRL3
        offset: 0x02C
        size: 32
        access: rw
        reset: 0x00000000
        description: "Pad Control Register bit[11:0] PD | bit[23:12] PU"
        fields:
          - {name: PD, bit_offset: 0, bit_width: 12, description: "Select pull-down, one bit per pad"}
          - {name: PU, bit_offset: 12, bit_width: 12, description: "Select pull-up, one bit per pad"}
      - name: LEFT_PAD_CTRL4
        offset: 0x030
        size: 32
        access: rw
        reset: 0x00000000
        description: "Pad Control Register bit[23:0] PDRV (2 bits per pin)"
        fields:
          - {name: PDRV, bit_offset: 0, bit_width: 24, description: "2-bit drive-current fields: 00=2mA, 01=4mA, 10=8mA, 11=12mA"}
      - name: BOT_PAD_CTRL0
        offset: 0x034
        size: 32
        access: rw
        reset: 0x00C5007F
        description: "Pad Control Register bit[11:0] IE | bit[23:12] PE (active-low pull enable)"
        fields:
          - {name: IE, bit_offset: 0, bit_width: 12, description: "Enable the digital input path, one bit per pad"}
          - {name: PE, bit_offset: 12, bit_width: 12, description: "Pull-cell control active-low: 0=enabled, 1=disabled"}
      - name: BOT_PAD_CTRL1
        offset: 0x038
        size: 32
        access: rw
        reset: 0x00FFFFFF
        description: "Pad Control Register bit[11:0] DS"
        fields:
          - {name: DS, bit_offset: 0, bit_width: 12, description: "Coarse drive strength: 0=low, 1=high"}
      - name: BOT_PAD_CTRL2
        offset: 0x03C
        size: 32
        access: rw
        reset: 0x00000000
        description: "Pad Control Register bit[11:0] SL | bit[23:12] CS"
        fields:
          - {name: SL, bit_offset: 0, bit_width: 12, description: "Slew rate: 0=slow, 1=fast"}
          - {name: CS, bit_offset: 12, bit_width: 12, description: "Schmitt trigger: 0=disabled, 1=enabled"}
      - name: BOT_PAD_CTRL3
        offset: 0x040
        size: 32
        access: rw
        reset: 0x00000000
        description: "Pad Control Register bit[11:0] PD | bit[23:12] PU"
        fields:
          - {name: PD, bit_offset: 0, bit_width: 12, description: "Select pull-down, one bit per pad"}
          - {name: PU, bit_offset: 12, bit_width: 12, description: "Select pull-up, one bit per pad"}
      - name: BOT_PAD_CTRL4
        offset: 0x044
        size: 32
        access: rw
        reset: 0x00000000
        description: "Pad Control Register bit[23:0] PDRV (2 bits per pin)"
        fields:
          - {name: PDRV, bit_offset: 0, bit_width: 24, description: "2-bit drive-current fields: 00=2mA, 01=4mA, 10=8mA, 11=12mA"}
      - name: RIGHT_PAD_CTRL0
        offset: 0x048
        size: 32
        access: rw
        reset: 0x00F80580
        description: "Pad Control Register bit[11:0] IE | bit[23:12] PE (active-low pull enable)"
        fields:
          - {name: IE, bit_offset: 0, bit_width: 12, description: "Enable the digital input path, one bit per pad"}
          - {name: PE, bit_offset: 12, bit_width: 12, description: "Pull-cell control active-low: 0=enabled, 1=disabled"}
      - name: RIGHT_PAD_CTRL1
        offset: 0x04C
        size: 32
        access: rw
        reset: 0x00FFFFFF
        description: "Pad Control Register bit[11:0] DS"
        fields:
          - {name: DS, bit_offset: 0, bit_width: 12, description: "Coarse drive strength: 0=low, 1=high"}
      - name: RIGHT_PAD_CTRL2
        offset: 0x050
        size: 32
        access: rw
        reset: 0x00000000
        description: "Pad Control Register bit[11:0] SL | bit[23:12] CS"
        fields:
          - {name: SL, bit_offset: 0, bit_width: 12, description: "Slew rate: 0=slow, 1=fast"}
          - {name: CS, bit_offset: 12, bit_width: 12, description: "Schmitt trigger: 0=disabled, 1=enabled"}
      - name: RIGHT_PAD_CTRL3
        offset: 0x054
        size: 32
        access: rw
        reset: 0x00000000
        description: "Pad Control Register bit[11:0] PD | bit[23:12] PU"
        fields:
          - {name: PD, bit_offset: 0, bit_width: 12, description: "Select pull-down, one bit per pad"}
          - {name: PU, bit_offset: 12, bit_width: 12, description: "Select pull-up, one bit per pad"}
      - name: RIGHT_PAD_CTRL4
        offset: 0x058
        size: 32
        access: rw
        reset: 0x00000000
        description: "Pad Control Register bit[23:0] PDRV (2 bits per pin)"
        fields:
          - {name: PDRV, bit_offset: 0, bit_width: 24, description: "2-bit drive-current fields: 00=2mA, 01=4mA, 10=8mA, 11=12mA"}
      - name: TOP_PAD_CTRL0
        offset: 0x05C
        size: 32
        access: rw
        reset: 0x00E16E0F
