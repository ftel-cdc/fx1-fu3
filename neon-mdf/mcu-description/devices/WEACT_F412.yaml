# WEACT_F412.yaml — IS NOT FU2.
#
# ============================================================================
# TEST RIG hardware REAL (STM32F412RET6 on WeAct Studio Core Board)
# ============================================================================
# The REAL user board is in hand (WeActStudio.STM32F4_64Pin_CoreBoard, populate chip STM32F412RET6).
# FU2 is ONLY the same as STM32 at GENERAL ARCHITECTURE level - There is no register layout matching
# confirmation, so do NOT use this device to infer anything about FU2.
#
# OTHER NUCLEO_L031K6: This WeAct board has NO on-board debugger (not Nucleo) - MUST use a removable
# SWD probe (ST-LINK V2 clone or equivalent) connected to the 4-pin header (3V3/GND/SWCLK/SWDIO).
# QEMU does not have a machine model for this board - only build/link is available now.
#
# DATA SOURCE (REAL) - cross-check over the real source (curl directly from
# STMicroelectronics/cmsis_device_f4, NOT deduced from previous STM32F0/L0 done though same ST
# carrier):
#   - GPIO_TypeDef, RCC_BASE, GPIOx_BASE, AHB1ENR REAL Magnetic
#     Include/stm32f412zx.h (STMicroelectronics/cmsis_device_f4).
#   - IMPORTANT: STM32F4 enables GPIO clock via `RCC->AHB1ENR` (offset 0x30, bit GPIOBEN=1) - OTHERS TWO
#     previous boards: neither `AHBENR` offset 0x14 (STM32F0) nor `IOPENR` offset 0x2C (STM32L0).
#     This is the THIRD name/offset type in 3 looked up STM32 lines - confirmed NOT inferred, must
#     look up each line separately.
#   - __MPU_PRESENT=1, __FPU_PRESENT=1, __NVIC_PRIO_BITS=4 TRUE (confirms via stm32f412zx.h primary) -
#     OTHER Cortex-M0/M0+ (no FPU, only 2 bit priority) - this is the FIRST Cortex-M4F board in the
#     SDK.
#   - LED LD (onboard, according to WeAct STM32F4 Core Board - same PCB layout for both
#     F405/F411/F412/F446) = PB2, active-HIGH (write 1 = bright).
#   - Flash 512KB, RAM 256KB (STM32F412RET6, OTHER F405 - 1MB/192KB - same WeAct board, different populate
#     chip).
#   - Default Clock after reset: HSI 16MHz (STM32F4 standard, OTHER HSI 8MHz of F0 and MSI ~2.097MHz of
#     L0).
#   - NOT verify live on silicon (openocd + SWD probe installed, not flash tested) - see ARCHITECTURE.md
#     when updating.
#
# SCOPE: only GPIOB (enough for LED) + RCC (only AHB1ENR to enable GPIOB clock) - NO UART/I2C/SPI.
# ============================================================================

device: WEACT_F412
vendor: STMicroelectronics
family: WEACT_F412
arch: cortex-m4
description: >
  STM32F412RET6 (WeAct Studio STM32F4 Core Board) - test rig hardware the real user has, NOT FU2
  chips. See file header warning.

cpu:
  core: cortex-m4
  revision: r0p1                # TRUE - confirm via __CM4_REV=0x0001U in stm32f412zx.h
  max_freq_hz: 100000000        # 100MHz - max frequency STM32F412 (according to datasheet, OTHER F405 168MHz)
  nvic_priority_bits: 4         # TRUE - confirm __NVIC_PRIO_BITS=4U (OTHER Cortex-M0/M0+ only 2 bits)
  num_irq: 97                   # TRUE - validates via IRQn_Type in stm32f412zx.h (STMicroelectronics/cmsis_device_f4): highest IRQ is FMPI2C1_ER_IRQn=96 -> 97 lines (0..96). used for validate loader.py and for SCB->VTOR alignment (see bootloader.image_header_size below) - must be true silicon NVIC, not the IRQ declared in `interrupts:` (currently empty).
  vtor_supported: true          # Cortex-M4 ALWAYS has VTOR (required under ARMv7-M architecture, not optional like M0+)
  mpu_present: true             # TRUE - confirm __MPU_PRESENT=1U in stm32f412zx.h
  fpu_present: true             # TRUE - confirm __FPU_PRESENT=1U in stm32f412zx.h (STM32F412 is M4F)

memory:
  - name: FLASH_MEM             # do not set "FLASH" - middle name with peripheral FLASH controller (0x40023C00) below, generator will
    # create middle macro FLASH_BASE for 2 different dia only (see gen_cmsis_header.py memory-map)
    kind: flash
    address: 0x08000000         # STM32 true FLASH base (same as all STM32 series)
    size: 0x80000                 # 512 KB (according to datasheet STM32F412RET6 - OTHER F405 1MB)
  - name: RAM
    kind: ram
    address: 0x20000000
    size: 0x40000                  # 256 KB - confirmation via SRAM1_BASE/comment "(256 KB)" in stm32f412zx.h

peripherals:
  - name: RCC
    base: 0x40023800            # THAT - according to stm32f412zx.h (AHB1PERIPH_BASE + 0x3800)
    description: "REAL Reset and Clock Control - AHB1ENR (GPIO) + APB2ENR (USART1, required for UART bootloader)"
    registers:
      - {name: AHB1ENR, offset: 0x30, size: 32, access: rw, reset: 0x00000000, description: "AHB1 peripheral clock enable - bit 1=GPIOBEN. other AHBENR (STM32F0, offset 0x14) and IOPENR (STM32L0, offset 0x2C) - validate real RCC_AHB1ENR_GPIOBEN in stm32f412zx.h"}
      - {name: APB2ENR, offset: 0x44, size: 32, access: rw, reset: 0x00000000, description: "APB2 peripheral clock enable - bit 4=USART1EN. true - confirm RCC_APB2ENR_USART1EN_Pos=4 in stm32f412zx.h"}

  - name: GPIOA
    base: 0x40020000            # THAT - according to stm32f412zx.h (AHB1PERIPH_BASE + 0x0000)
    type: GPIO                  # must match the GPIOB layout; loader.py requires identical register layouts for a shared `type`. PA9/PA10 are bootloader UART1 TX/RX
    description: "GPIOA REAL - pins PA9(TX)/PA10(RX) for UART bootloader (USART1, AF7)"
    registers:
      - {name: MODER,   offset: 0x00, size: 32, access: rw, reset: 0xFFFFFFFF, description: "Mode: 2 bits/pin (00=input,01=output,10=AF,11=analog). Actual reset values vary for BOOT/debug pins; see RM0402. Use 0xFFFFFFFF (all analog) as a safe placeholder."}
      - {name: OTYPER,  offset: 0x04, size: 32, access: rw, reset: 0x00000000, description: "Output type - 1 bit/pin (0=push-pull, 1=open-drain)"}
      - {name: OSPEEDR, offset: 0x08, size: 32, access: rw, reset: 0x00000000, description: "Output speed - 2 bit/pin"}
      - {name: PUPDR,   offset: 0x0C, size: 32, access: rw, reset: 0x00000000, description: "Pull-up/pull-down - 2 bit/pin"}
      - {name: IDR,     offset: 0x10, size: 32, access: ro, reset: 0x00000000, description: "Input data - read current pin item, 1 pin per bit"}
      - {name: ODR,     offset: 0x14, size: 32, access: rw, reset: 0x00000000, description: "Output data: one bit per pin"}
      - {name: BSRR,    offset: 0x18, size: 32, access: wo, reset: 0x00000000, description: "bit set/reset - bit[15:0] write 1 to SET, bit[31:16] write 1 to RESET (atomic)"}
      - {name: LCKR,    offset: 0x1C, size: 32, access: rw, reset: 0x00000000, description: "Configuration lock"}
      - {name: AFRL,    offset: 0x20, size: 32, access: rw, reset: 0x00000000, description: "Alternate function - pin 0..7"}
      - {name: AFRH,    offset: 0x24, size: 32, access: rw, reset: 0x00000000, description: "Alternate function - pin 8..15"}

  - name: GPIOB
    base: 0x40020400            # THAT - according to stm32f412zx.h (AHB1PERIPH_BASE + 0x400)
    type: GPIO
    description: "GPIOB REAL - pins PB2=LED onboard of WeAct STM32F4 Core Board"
    registers:
      - {name: MODER,   offset: 0x00, size: 32, access: rw, reset: 0xFFFFFFFF, description: "Mode: 2 bits/pin (00=input,01=output,10=AF,11=analog). Actual reset values vary for BOOT/debug pins; see RM0402. Use 0xFFFFFFFF (all analog) as a safe placeholder."}
      - {name: OTYPER,  offset: 0x04, size: 32, access: rw, reset: 0x00000000, description: "Output type - 1 bit/pin (0=push-pull, 1=open-drain)"}
      - {name: OSPEEDR, offset: 0x08, size: 32, access: rw, reset: 0x00000000, description: "Output speed - 2 bit/pin"}
      - {name: PUPDR,   offset: 0x0C, size: 32, access: rw, reset: 0x00000000, description: "Pull-up/pull-down - 2 bit/pin"}
      - {name: IDR,     offset: 0x10, size: 32, access: ro, reset: 0x00000000, description: "Input data - read current pin item, 1 pin per bit"}
      - {name: ODR,     offset: 0x14, size: 32, access: rw, reset: 0x00000000, description: "Output data: one bit per pin"}
      - {name: BSRR,    offset: 0x18, size: 32, access: wo, reset: 0x00000000, description: "bit set/reset - bit[15:0] write 1 to SET, bit[31:16] write 1 to RESET (atomic)"}
      - {name: LCKR,    offset: 0x1C, size: 32, access: rw, reset: 0x00000000, description: "Configuration lock"}
      - {name: AFRL,    offset: 0x20, size: 32, access: rw, reset: 0x00000000, description: "Alternate function - pin 0..7"}
      - {name: AFRH,    offset: 0x24, size: 32, access: rw, reset: 0x00000000, description: "Alternate function - pin 8..15"}

  - name: USART1
    base: 0x40011000            # THAT - according to stm32f412zx.h (APB2PERIPH_BASE 0x40010000 + 0x1000)
    type: USART                 # convention CMSIS/ST real (USART_TypeDef generic for USART1/2/3...) - to future add USART2/3 generic struct like GPIOA/GPIOB
    description: "USART1 REAL - used by UART bootloader on PA9(TX)/PA10(RX), AF7, 115200 8N1 (see bootloader.uart below)"
    registers:
      - {name: SR,   offset: 0x00, size: 32, access: rw, reset: 0x000000C0, description: "Status: bit5=RXNE, bit6=TC, bit7=TXE. TXE=TC=1 after reset, ready to transmit"}
      - {name: DR,   offset: 0x04, size: 32, access: rw, reset: 0x00000000, description: "Data register (read = RX, write = TX)"}
      - {name: BRR,  offset: 0x08, size: 32, access: rw, reset: 0x00000000, description: "Baud rate - e.g. 0x8B for 115200 baud @ HSI 16MHz (OVER8=0)"}
      - {name: CR1,  offset: 0x0C, size: 32, access: rw, reset: 0x00000000, description: "Control 1 - bit2=RE, bit3=TE, bit13=UE"}
      - {name: CR2,  offset: 0x10, size: 32, access: rw, reset: 0x00000000, description: "Control 2 (unused - stop bits/clock)"}
      - {name: CR3,  offset: 0x14, size: 32, access: rw, reset: 0x00000000, description: "Control 3 (unused - flow control/DMA)"}
      - {name: GTPR, offset: 0x18, size: 32, access: rw, reset: 0x00000000, description: "Guard time + prescaler (unused - IrDA/smartcard)"}

  - name: FLASH
    base: 0x40023C00            # THAT - according to stm32f412zx.h (AHB1PERIPH_BASE 0x40020000 + 0x3C00)
    description: "REAL FLASH controller - used by bootloader to erase/program sector app (see components/driver/flash)"
    registers:
      - {name: ACR,     offset: 0x00, size: 32, access: rw, reset: 0x00000000, description: "Access control (latency/prefetch/cache) - not used"}
      - {name: KEYR,    offset: 0x04, size: 32, access: wo, reset: 0x00000000, description: "Key register - write KEY1=0x45670123 then KEY2=0xCDEF89AB to open CR department"}
      - {name: OPTKEYR, offset: 0x08, size: 32, access: wo, reset: 0x00000000, description: "Option key register - unused (no option bytes)"}
      - {name: SR,      offset: 0x0C, size: 32, access: rw, reset: 0x00000000, description: "Status - bit0=EOP, bit16=BSY"}
      - {name: CR,      offset: 0x10, size: 32, access: rw, reset: 0x80000000, description: "Control - bit0=PG, bit1=SER, bit[6:3]=SNB, bit[9:8]=PSIZE, bit16=STRT, bit31=LOCK (reset THAT = locked)"}
      - {name: OPTCR,   offset: 0x14, size: 32, access: rw, reset: 0x00000000, description: "Option control - not used"}
      - {name: OPTCR1,  offset: 0x18, size: 32, access: rw, reset: 0x00000000, description: "Option control 1 - not used"}

interrupts: []   # micro enough blink only use polling, no need IRQ (like other targets)

# ============================================================================
# BOOTLOADER PARTITION LAYOUT (each, used for mcu-description generator creation
# <DEVICE>_BOOTLOADER.ld + <DEVICE>_APP.ld + macro NEON_MDF_APP_* - view
# gen_linker_script.py, gen_cmsis_header.py, loader.py).
#
# size = 0x8000 (32KB) = sector 0+1 (STM32F412 sector 0-3 = 16KB/sector,
# See RM0402) - the current real bootloader (Bootloader_WeAct) only uses ~1.5KB, 32KB is enough for
# the future.
#
# image_header_size = 0x200 (512B), not 16 (sizeof image_header_t
# hardware). It must be large enough to ensure APP_VECTOR_BASE = flash.address +
# bootloader.size + image_header_size satisfy the alignment requirement of SCB->VTOR: ARMv7-M
# (16 core vectors + num_irq=97 = 113, rounded up to a power of two: 128; 128*4 =
# 0x200 bytes). if selected smaller, HW will automatically drop down (no error) -> VTOR points to the
# wrong value of the actual value, silent error only occurs when the app uses the real interrupt
# (e.g. FreeRTOS SysTick/PendSV) - see loader.py._check_bootloader_vtor_alignment().
bootloader:
  size: 0x8000
  image_header_size: 0x200
  uart:
    peripheral: USART1              # see peripherals.name above
    tx_pin: PA9
    rx_pin: PA10
    af: 7                           # AF7 = USART1/2/3 on GPIO, standard STM32F4 (not F412)
    baud: 115200

# by real sector of STM32F412 (RM0402, confirm via WebSearch - not auto guess F0/L0 use page evenly,
# see corresponding comment in components/driver/flash/neon_flash_weact_f412.c - 2 where to match,
# not synchronized automatically: update both copies together). tools/gen_flashmap.py uses it to validate flashmap.csv
# of app (if any).
erase_sectors:
  - size: 0x4000    # sectors 0-3, 16KB each
    count: 4
  - size: 0x10000   # sector 4, 64KB
    count: 1
  - size: 0x20000   # sectors 5-7, 128KB each
    count: 3
