# CPU fields for GT32U2086 (Arm Cortex-M0), extending common.schema.yaml.
cpu:
  nvic_priority_bits: 2       # Implemented NVIC priority bits.
  num_irq: 32                # External IRQ slots, IRQ0..IRQ31.
  vtor_supported: false      # BootROM forwards exceptions using the SRAM relay.
  mpu_present: false         # Optional field, defaults to false.
  fpu_present: false         # Optional field, defaults to false.

# Vector table: 0 initial stack; 1 Reset; 2 NMI; 3 HardFault;
# 4..10 reserved; 11 SVC; 12..13 reserved; 14 PendSV; 15 SysTick;
# 16+n external IRQ n. Undeclared external slots are reserved.
# Application vectors are at the selected profile's vector base, not ROM base.
# Cortex-M0 has no VTOR: the ROM relay and its reserved SRAM must remain intact.
